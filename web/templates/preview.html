                return `
                <div class="cd" style="background:${bg}; border-right:3px solid ${border}; padding:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                    <div style="flex:1">
                        <div style="display:flex; align-items:center; gap:5px; margin-bottom:5px">
                            <i class="ph ${icon}" style="color:${border}"></i>
                            <span style="font-size:11px; font-weight:900; color:${border}">${roleName}</span>
                            <span style="font-size:9px; color:var(--mt); margin-right:auto">${time}</span>
                        </div>
                        <div style="font-size:12px; color:var(--tx); line-height:1.5">${m.content}</div>
                    </div>
                    <button onclick="window.deleteMemory(${m.id})" style="background:none; border:none; color:var(--dn); cursor:pointer; padding:5px; font-size:16px; opacity:0.7; transition:0.2s" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'"><i class="ph ph-trash"></i></button>
                </div>`;
            }).join('');
        } catch(e) {
            document.getElementById('ai-memory-list').innerHTML = '<div style="text-align:center; color:var(--dn); padding:20px">فشل تحميل الذاكرة</div>';
        }
    };

    // 5. مسح رسالة
    window.deleteMemory = async function(id) {
        try {
            await fetch('/api/web/ai_memory/delete', {
                method: 'POST', headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({id: id})
            });
            window.loadAiMemory();
        } catch(e) {}
    };

    // 6. مسح الكل
    window.clearAiMemory = async function() {
        if(!confirm('هل أنت متأكد من مسح كل ذاكرة المساعد؟ سينسى كل شيء عنك.')) return;
        try {
            await fetch('/api/web/ai_memory/clear', {method: 'POST', headers: H});
            if(typeof tst === 'function') tst('🧹 تم مسح الذاكرة بالكامل', 'ok');
            window.loadAiMemory();
        } catch(e) {}
    };
});
</script>


<script id="ai_files_logic">
document.addEventListener("DOMContentLoaded", function() {
    // استبدال دالة رفع الصورة القديمة عشان تقبل أي ملف
    window.upImg = async function(inp) {
        if(!inp.files[0]) return;
        const file = inp.files[0];
        
        const b = document.getElementById('msgs');
        const fileIcon = file.type.includes('pdf') ? 'ph-file-pdf' : (file.type.includes('image') ? 'ph-image' : 'ph-file-text');
        
        b.innerHTML += `<div class="m u"><div class="ma"><i class="ph ${fileIcon}"></i></div><div class="mb">📎 تحليل ملف: ${file.name}</div></div>`;
        b.scrollTop = b.scrollHeight;
        
        const id = 't' + Date.now();
        b.innerHTML += `<div class="m a" id="${id}"><div class="ma"><i class="ph ph-spider"></i></div><div class="mb"><div class="tp"><span></span><span></span><span></span></div><div style="font-size:11px;color:var(--mt);margin-top:5px">جاري تحليل الملف...</div></div></div>`;
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;
            try {
                const r = await fetch('/api/web/ai_vision', {
                    method: 'POST',
                    headers: {...H, 'Content-Type':'application/json'},
                    body: JSON.stringify({
                        image: base64, 
                        mime_type: file.type || 'application/octet-stream',
                        prompt: "حلل هذا الملف بالتفصيل. لو كان كود، اشرحه. لو كان PDF أو نص، لخصه وأبرز أهم النقاط."
                    })
                });
                const d = await r.json();
                document.getElementById(id).remove();
                
                if(d.error) {
                    b.innerHTML += `<div class="m a"><div class="ma" style="background:var(--dn)"><i class="ph ph-warning"></i></div><div class="mb" style="color:var(--dn)">${d.error}</div></div>`;
                } else {
                    b.innerHTML += `<div class="m a"><div class="ma"><i class="ph ph-spider"></i></div><div class="mb">${marked.parse(d.reply)}</div></div>`;
                    if(typeof fireConfetti === 'function') fireConfetti();
                }
            } catch(err) {
                document.getElementById(id).remove();
                b.innerHTML += `<div class="m a"><div class="mb" style="color:var(--dn)">فشل الاتصال</div></div>`;
            }
            inp.value = ''; // تفريغ الخانة
            b.scrollTop = b.scrollHeight;
        };
        reader.readAsDataURL(file);
    };
    
    // تغيير أيقونة زرار الرفع من صورة لملف
    setTimeout(() => {
        let fupBtn = document.querySelector('button[onclick*="fup"]');
        if(fupBtn && fupBtn.innerHTML.includes('ph-plus')) {
             // لو لسه زرار الزائد، نسايبه
        } else if(fupBtn) {
            fupBtn.innerHTML = '<i class="ph ph-paperclip"></i>';
        }
    }, 1500);
});
</script>


<script id="ai_zip_logic">
document.addEventListener("DOMContentLoaded", function() {
    // تحديث دالة الرفع لتتعرف على الـ ZIP
    window.upImg = async function(inp) {
        if(!inp.files[0]) return;
        const file = inp.files[0];
        const isZip = file.name.endsWith('.zip');
        
        const b = document.getElementById('msgs');
        const fileIcon = isZip ? 'ph-file-zip' : (file.type.includes('pdf') ? 'ph-file-pdf' : (file.type.includes('image') ? 'ph-image' : 'ph-file-text'));
        
        b.innerHTML += `<div class="m u"><div class="ma"><i class="ph ${fileIcon}"></i></div><div class="mb">📎 تحليل ملف: ${file.name}</div></div>`;
        b.scrollTop = b.scrollHeight;
        
        const id = 't' + Date.now();
        b.innerHTML += `<div class="m a" id="${id}"><div class="ma"><i class="ph ph-spider"></i></div><div class="mb"><div class="tp"><span></span><span></span><span></span></div><div style="font-size:11px;color:var(--mt);margin-top:5px">${isZip ? 'جاري فك الضغط وقراءة الأكواد...' : 'جاري تحليل الملف...'}</div></div></div>`;
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;
            try {
                const endpoint = isZip ? '/api/web/ai_zip_analyze' : '/api/web/ai_vision';
                const body = isZip ? {zip: base64} : {image: base64, mime_type: file.type || 'application/octet-stream', prompt: "حلل هذا الملف بالتفصيل. لو كان كود، اشرحه. لو كان PDF أو نص، لخصه وأبرز أهم النقاط."};
                
                const r = await fetch(endpoint, {
                    method: 'POST',
                    headers: {...H, 'Content-Type':'application/json'},
                    body: JSON.stringify(body)
                });
                const d = await r.json();
                document.getElementById(id).remove();
                
                if(d.error) {
                    b.innerHTML += `<div class="m a"><div class="ma" style="background:var(--dn)"><i class="ph ph-warning"></i></div><div class="mb" style="color:var(--dn)">${d.error}</div></div>`;
                } else {
                    b.innerHTML += `<div class="m a"><div class="ma"><i class="ph ph-spider"></i></div><div class="mb">${marked.parse(d.reply)}</div></div>`;
                    if(typeof fireConfetti === 'function') fireConfetti();
                }
            } catch(err) {
                document.getElementById(id).remove();
                b.innerHTML += `<div class="m a"><div class="mb" style="color:var(--dn)">فشل الاتصال</div></div>`;
            }
            inp.value = '';
            b.scrollTop = b.scrollHeight;
        };
        reader.readAsDataURL(file);
    };
});
</script>
