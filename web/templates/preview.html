        window.renderCharts();
    };

    window.renderCharts = async function() {
        try {
            const [meRes, vaultRes, achRes] = await Promise.all([
                fetch('/api/web/me', {headers: H}),
                fetch('/api/web/vault/stats', {headers: H}),
                fetch('/api/web/achievements/list', {headers: H})
            ]);
            const me = await meRes.json();
            const vault = await vaultRes.json();
            const ach = await achRes.json();
            
            // ═══ 1. رسمة النشاط (Bar) ═══
            const ctxActivity = document.getElementById('chart-activity');
            if(ctxActivity) {
                new Chart(ctxActivity, {
                    type: 'bar',
                    data: {
                        labels: ['سحبت', 'ضخيت', 'إنجازات'],
                        datasets: [{
                            label: 'العدد',
                            data: [me.total_scraped || 0, me.total_pumped || 0, (ach.achievements || []).filter(a => a.unlocked).length],
                            backgroundColor: ['rgba(139,92,246,0.6)', 'rgba(59,130,246,0.6)', 'rgba(245,158,11,0.6)'],
                            borderColor: ['#8b5cf6', '#3b82f6', '#f59e0b'],
                            borderWidth: 1,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, ticks: { color: '#94a3b8', font: {family:'Cairo'} }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            x: { ticks: { color: '#fff', font: {family:'Cairo', weight:'bold'} }, grid: { display: false } }
                        }
                    }
                });
            }

            // ═══ 2. رسمة المخزن (Doughnut) ═══
            const ctxVault = document.getElementById('chart-vault');
            if(ctxVault) {
                new Chart(ctxVault, {
                    type: 'doughnut',
                    data: {
                        labels: ['بيوزر', 'بدون يوزر'],
                        datasets: [{
                            data: [vault.with_username || 0, vault.without_username || 0],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        cutout: '70%',
                        plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: {family:'Cairo', size:10}, boxWidth: 10 } } }
                    }
                });
            }

            // ═══ 3. رسمة المستوى (Circular Progress) ═══
            const lvl = me.level || 1;
            const xp = me.xp || 0;
            const xpInLevel = xp % 100;
            
            document.getElementById('level-num').textContent = lvl;
            document.getElementById('xp-text').textContent = xpInLevel + ' / 100 XP';

            const ctxLevel = document.getElementById('chart-level');
            if(ctxLevel) {
                new Chart(ctxLevel, {
                    type: 'doughnut',
                    data: {
                        labels: ['XP', ''],
                        datasets: [{
                            data: [xpInLevel, 100 - xpInLevel],
                            backgroundColor: ['#f59e0b', 'rgba(255,255,255,0.05)'],
                            borderWidth: 0,
                            circumference: 360,
                            rotation: 0
                        }]
                    },
                    options: {
                        responsive: false,
                        cutout: '80%',
                        plugins: { legend: { display: false }, tooltip: { enabled: false } }
                    }
                });
            }
        } catch(e) { console.error(e); }
    };
});
</script>


<script id="rpg_tasks_logic">
document.addEventListener("DOMContentLoaded", function() {
    // ═══ دالة عرض المهام (تصميم RPG) ═══
    window.r_tasks = async function() {
        const el = document.getElementById('pg-tasks');
        if(!el) return;
        
        el.innerHTML = `
        <div class="pt" style="display:flex;justify-content:space-between;align-items:center">
            <div><i class="ph ph-sword" style="color:var(--wn)"></i> مهام المغامرة اليومية</div>
            <div style="font-size:10px;color:var(--ok);background:rgba(16,185,129,0.1);padding:4px 8px;border-radius:10px;border:1px solid rgba(16,185,129,0.3)">تتجدد يومياً</div>
        </div>
        <div id="tasks-list-container" style="display:flex;flex-direction:column;gap:15px;margin-top:15px">
            <div class="cd" style="text-align:center;color:var(--mt);padding:30px">جاري تحميل لوحة المهام...</div>
        </div>
        `;
        
        window.loadRPGTasks();
    };

    window.loadRPGTasks = async function() {
        try {
            const r = await fetch('/api/web/tasks', {headers: H});
            const d = await r.json();
            const container = document.getElementById('tasks-list-container');
            if(!container) return;
            
            if(!d.tasks || d.tasks.length === 0) {
                container.innerHTML = '<div class="cd" style="text-align:center;color:var(--mt);padding:20px">لا توجد مهام اليوم.</div>';
                return;
            }
            
            // أيقونات وألوان للمهام
            const questIcons = {
                't1': { icon: 'ph-spider', color: '#8b5cf6', bg: 'rgba(139,92,246,0.1)' },
                't2': { icon: 'ph-rocket', color: '#3b82f6', bg: 'rgba(59,130,246,0.1)' },
                't3': { icon: 'ph-circle-notch', color: '#f59e0b', bg: 'rgba(245,158,11,0.1)' },
                't4': { icon: 'ph-chat-circle-dots', color: '#10b981', bg: 'rgba(16,185,129,0.1)' },
                't5': { icon: 'ph-image', color: '#ec4899', bg: 'rgba(236,72,153,0.1)' }
            };
            
            container.innerHTML = d.tasks.map(t => {
                const q = questIcons[t.id] || { icon: 'ph-star', color: '#fff', bg: 'rgba(255,255,255,0.1)' };
                const isDone = t.done;
                
                return `
                <div style="
                    background: linear-gradient(145deg, rgba(30,41,59,0.7), rgba(15,23,42,0.9));
                    border: 1px solid ${isDone ? 'rgba(16,185,129,0.4)' : 'rgba(255,255,255,0.1)'};
                    border-radius: 16px;
                    padding: 16px;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    position: relative;
                    overflow: hidden;
                    transition: all 0.3s ease;
                    box-shadow: ${isDone ? '0 0 15px rgba(16,185,129,0.1)' : '0 5px 15px rgba(0,0,0,0.2)'};
                ">
                    <!-- خلفية متوهجة للمهمة -->
                    <div style="position:absolute; top:-20px; left:-20px; width:80px; height:80px; background:${q.color}; filter:blur(40px); opacity:0.15;"></div>
                    
                    <div style="display:flex; align-items:center; gap:15px; z-index:1">
                        <div style="
                            width: 45px; height: 45px; border-radius: 12px;
                            background: ${q.bg};
                            border: 1px solid ${q.color}40;
                            display: flex; align-items: center; justify-content: center;
                            color: ${q.color}; font-size: 22px;
                            box-shadow: inset 0 0 10px ${q.color}20;
                        ">
                            <i class="ph ${q.icon}"></i>
                        </div>
                        <div>
                            <div style="font-size: 14px; font-weight: 900; color: #fff; margin-bottom: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.5)">${t.name}</div>
                            <div style="font-size: 12px; font-weight: 800; color: var(--wn); display: flex; align-items: center; gap: 4px;">
                                <i class="ph ph-coins"></i> +${t.reward} نقطة
                            </div>
                        </div>
                    </div>
                    
                    <div style="z-index:1">
                        ${isDone 
                            ? `<div style="display:flex;flex-direction:column;align-items:center;color:var(--ok);gap:4px"><i class="ph ph-check-circle" style="font-size:28px;filter:drop-shadow(0 0 5px rgba(16,185,129,0.5))"></i><span style="font-size:9px;font-weight:900">مكتملة</span></div>` 
                            : `<button onclick="claimRPGTask('${t.id}', this, ${t.reward})" style="
                                background: linear-gradient(135deg, #f59e0b, #d97706);
                                color: #fff; border: none; padding: 10px 18px;
                                border-radius: 10px; font-size: 12px; font-weight: 900;
                                font-family: Cairo, sans-serif; cursor: pointer;
                                box-shadow: 0 4px 15px rgba(245,158,11,0.4);
                                transition: transform 0.2s, box-shadow 0.2s;
                                display: flex; align-items: center; gap: 6px;
                            " onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 20px rgba(245,158,11,0.6)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 15px rgba(245,158,11,0.4)'">
                                <i class="ph ph-gift"></i> استلام
                            </button>`
                        }
                    </div>
                </div>`;
            }).join('');
        } catch(e) { console.error(e); }
    };

    // ═══ دالة استلام المكافأة ═══
    window.claimRPGTask = async function(taskId, btn, reward) {
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="ph ph-spinner-gap" style="animation:spin 1s linear infinite"></i>';
        
        try {
            const r = await fetch('/api/web/tasks/claim', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({task_id: taskId})
            });
            const d = await r.json();
            
            if(d.ok || d.reward) {
                // نجاح
                if(typeof fireConfetti === 'function') fireConfetti();
                if(typeof tst === 'function') tst('🎉 تم استلام ' + (d.reward || reward) + ' نقطة', 'ok');
                
                // تحديث الرصيد في الهيدر
                const tp = document.getElementById('tp');
                if(tp && !S.o) {
                    const c = parseInt(tp.textContent) || 0;
                    tp.textContent = (c + (d.reward || reward)) + ' 🪙';
                }
                
                // تحويل الزرار لـ مكتمل
                btn.parentElement.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;color:var(--ok);gap:4px"><i class="ph ph-check-circle" style="font-size:28px;filter:drop-shadow(0 0 5px rgba(16,185,129,0.5))"></i><span style="font-size:9px;font-weight:900">مكتملة</span></div>`;
                // تغيير لون الكارت للأخضر
                let card = btn.closest('div').parentElement;
                if(card) {
                    card.style.borderColor = 'rgba(16,185,129,0.4)';
                    card.style.boxShadow = '0 0 15px rgba(16,185,129,0.1)';
                }
            } else {
                if(typeof tst === 'function') tst(d.error || 'حدث خطأ', 'er');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        } catch(e) {
            if(typeof tst === 'function') tst('فشل الاتصال', 'er');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    };
});
</script>


<script id="redeem_logic">
document.addEventListener("DOMContentLoaded", function() {
    // 1. إنشاء الحاوية ديناميكياً
    setInterval(function() {
        let mn = document.querySelector('.mn');
        if (mn && !document.getElementById('v-redeem')) {
            let div = document.createElement('div');
            div.className = 'vw';
            div.id = 'v-redeem';
            div.innerHTML = '<div class="pi" id="pg-redeem"></div>';
            mn.appendChild(div);
        }
    }, 500);

    // 2. حقن زر في القائمة (تحت الأساسيات)
    setInterval(function() {
        let navElement = document.getElementById('nav');
        if (navElement && !document.getElementById('nv-redeem')) {
            let groups = navElement.querySelectorAll('.grp');
            let basicsGroup = Array.from(groups).find(g => g.textContent.trim() === 'الأساسيات');
            
            let newBtn = document.createElement('div');
            newBtn.className = 'nv';
            newBtn.id = 'nv-redeem';
            newBtn.onclick = function() { g('redeem'); };
            newBtn.innerHTML = '<i class="ph ph-ticket"></i> تفعيل كود';

            if (basicsGroup) {
                basicsGroup.insertAdjacentElement('afterend', newBtn);
            } else {
                navElement.appendChild(newBtn);
            }
        }
    }, 1000);

    // 3. دالة عرض الصفحة
    window.r_redeem = async function() {
        const el = document.getElementById('pg-redeem');
        if(!el) return;
        
        let ownerSection = '';
        if(S.o) {
            ownerSection = `
            <div class="pt" style="margin-top:30px"><i class="ph ph-magic-wand" style="color:var(--wn)"></i> لوحة المالك (توليد الأكواد)</div>
            <div class="cd" style="background:linear-gradient(135deg, rgba(245,158,11,0.1), rgba(0,0,0,0)); border-color:rgba(245,158,11,0.3); padding:20px">
                <div style="display:flex; gap:10px">
                    <input type="number" id="gen-code-value" placeholder="قيمة الكود (نقاط)" value="500" style="flex:1; background:rgba(0,0,0,0.5); border:1px solid var(--bd); padding:12px; border-radius:10px; color:#fff; font-size:14px; font-family:monospace; outline:none; text-align:center;">
                    <button onclick="generateCode(this)" style="padding:0 20px; background:linear-gradient(135deg, var(--wn), #d97706); color:#fff; border:none; border-radius:10px; font-weight:900; font-family:Cairo,sans-serif; cursor:pointer; box-shadow:0 4px 15px rgba(245,158,11,0.3);">توليد</button>
                </div>
                <div id="gen-code-result" style="display:none; margin-top:15px; padding:15px; background:rgba(16,185,129,0.1); border:1px dashed var(--ok); border-radius:10px; text-align:center;">
                    <div style="font-size:11px; color:var(--ok); margin-bottom:5px">تم توليد الكود بنجاح:</div>
                    <div id="gen-code-text" style="font-size:20px; font-family:monospace; font-weight:900; color:#fff; letter-spacing:2px; cursor:pointer" onclick="navigator.clipboard.writeText(this.textContent); tst('✅ تم النسخ', 'ok');"></div>
                </div>
            </div>
            `;
        }
        
        el.innerHTML = `
        <div class="pt"><i class="ph ph-ticket" style="color:var(--p1)"></i> تفعيل كود</div>
        
        <div style="background: linear-gradient(145deg, rgba(30,41,59,0.7), rgba(15,23,42,0.9)); border: 1px solid rgba(139,92,246,0.3); border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden;">
            <div style="position:absolute; top:-50px; left:-50px; width:150px; height:150px; background:var(--p1); filter:blur(60px); opacity:0.2;"></div>
            
            <div style="font-size:60px; margin-bottom:15px; filter:drop-shadow(0 10px 15px rgba(0,0,0,0.4))">🎟️</div>
            <h3 style="color:#fff; font-size:18px; font-weight:900; margin-bottom:10px">هل لديك كود هدايا؟</h3>
            <p style="color:var(--mt); font-size:12px; margin-bottom:25px">أدخل الكود بالأسفل لاستلام النقاط فوراً.</p>
            
            <input type="text" id="redeem-input" placeholder="SPIDER_XXXXXX" style="width:100%; background:rgba(0,0,0,0.5); border:2px solid var(--bd); padding:15px; border-radius:12px; color:#fff; font-size:18px; font-family:monospace; text-align:center; letter-spacing:2px; outline:none; margin-bottom:15px; transition:0.3s;" onfocus="this.style.borderColor='var(--p1)'" onblur="this.style.borderColor='var(--bd)'">
            
            <button onclick="redeemCode(this)" style="width:100%; padding:15px; background:linear-gradient(135deg, var(--p1), var(--p2)); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:900; font-family:Cairo,sans-serif; cursor:pointer; box-shadow:0 8px 20px rgba(139,92,246,0.3); display:flex; justify-content:center; align-items:center; gap:8px;">
                <i class="ph ph-check-circle"></i> تفعيل الكود
            </button>
        </div>
        
        ${ownerSection}
        `;
    };

    // 4. دالة التفعيل
    window.redeemCode = async function(btn) {
        const input = document.getElementById('redeem-input');
        const code = input.value.trim();
        if(!code) { if(typeof tst === 'function') tst('❌ اكتب الكود أولاً', 'er'); return; }
        
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'جاري التفعيل...';
        
        try {
            const r = await fetch('/api/web/redeem', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({code: code})
            });
            const d = await r.json();
            
            if(d.error) {
                if(typeof tst === 'function') tst('❌ ' + d.error, 'er');
                input.style.borderColor = 'var(--dn)';
                setTimeout(()=>input.style.borderColor = 'var(--bd)', 2000);
            } else {
                if(typeof fireConfetti === 'function') fireConfetti();
                if(typeof tst === 'function') tst('🎉 تم تفعيل الكود وحصلت على ' + d.value + ' نقطة', 'ok');
                input.value = '';
                
                // تحديث الرصيد
                const tp = document.getElementById('tp');
                if(tp && !S.o) {
                    const c = parseInt(tp.textContent) || 0;
                    tp.textContent = (c + d.value) + ' 🪙';
                }
            }
        } catch(e) {
            if(typeof tst === 'function') tst('فشل الاتصال', 'er');
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    };

    // 5. دالة توليد الكود (للمالك)
    window.generateCode = async function(btn) {
        const val = document.getElementById('gen-code-value').value.trim();
        if(!val) {
            if(typeof tst === 'function') tst('❌ اكتب القيمة أولاً', 'er');
            return;
        }
        
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '...';
        
        try {
            const r = await fetch('/api/web/codes/generate', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({value: val})
            });
            
            let d;
            try { d = await r.json(); } catch(e) { d = {error: 'السيرفر وقع أو حدث خطأ داخلي'}; }
            
            if(d.error) {
                if(typeof tst === 'function') tst('❌ ' + d.error, 'er');
            } else if (d.code) {
                document.getElementById('gen-code-result').style.display = 'block';
                document.getElementById('gen-code-text').textContent = d.code;
                if(typeof tst === 'function') tst('✅ تم توليد الكود بنجاح', 'ok');
                if(typeof fireConfetti === 'function') fireConfetti();
            } else {
                if(typeof tst === 'function') tst('❌ لم يتم توليد الكود', 'er');
            }
        } catch(e) {
            if(typeof tst === 'function') tst('❌ فشل الاتصال بالسيرفر', 'er');
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    };
});
</script>

    window.r_arcade = function() {
        const el = document.getElementById('pg-arcade');
        if(!el) return;
        
        el.innerHTML = `
        <div class="pt"><i class="ph ph-game-controller" style="color:var(--p2)"></i> مركز الألعاب</div>
        
        <div class="cd" style="background:linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.1)); border-color:rgba(59,130,246,0.3); padding:20px; text-align:center;">
            <h3 style="color:#fff; font-size:18px; margin-bottom:5px">تحدي إكس أو (Tic Tac Toe)</h3>
            <p style="color:var(--mt); font-size:12px; margin-bottom:20px">اهزم البوت واكسب <b style="color:var(--wn)">50 نقطة</b> (بحد أقصى 5 مرات يومياً)</p>
            
            <!-- لوحة اللعبة -->
            <div id="ttt-board" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:250px; margin:0 auto 20px;">
                <!-- المربعات بتتولد بالجافاسكريبت -->
            </div>
            
            <div id="ttt-status" style="font-size:16px; font-weight:900; color:var(--p1); min-height:24px; margin-bottom:15px;">دورك! أنت (X)</div>
            
            <button onclick="startTTT()" style="padding:10px 30px; background:rgba(255,255,255,0.05); border:1px solid var(--bd); border-radius:10px; color:#fff; font-weight:900; font-family:Cairo,sans-serif; cursor:pointer; transition:0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">🔄 إعادة اللعب</button>
        </div>
        `;
        
        window.startTTT();
    };

    // 4. منطق اللعبة
    let board = ['', '', '', '', '', '', '', '', ''];
    let isPlayerTurn = true;
    let gameActive = false;

    window.startTTT = function() {
        board = ['', '', '', '', '', '', '', '', ''];
        isPlayerTurn = true;
        gameActive = true;
        
        const boardEl = document.getElementById('ttt-board');
        if(!boardEl) return;
        boardEl.innerHTML = '';
        
        const statusEl = document.getElementById('ttt-status');
        if(statusEl) { statusEl.textContent = 'دورك! أنت (X)'; statusEl.style.color = 'var(--p1)'; }
        
        for(let i=0; i<9; i++) {
            let cell = document.createElement('div');
            cell.style.cssText = 'width:100%; aspect-ratio:1; background:rgba(0,0,0,0.4); border:2px solid rgba(139,92,246,0.3); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:900; cursor:pointer; transition:0.2s; user-select:none;';
            cell.onmouseover = function() { if(this.textContent === '') this.style.borderColor = 'var(--p1)'; };
            cell.onmouseout = function() { if(this.textContent === '') this.style.borderColor = 'rgba(139,92,246,0.3)'; };
            cell.onclick = function() { window.handleCellClick(i, this); };
            boardEl.appendChild(cell);
        }
    };

    window.handleCellClick = function(index, cellEl) {
        if(!gameActive || !isPlayerTurn || board[index] !== '') return;
        
        // لعب اللاعب
        board[index] = 'X';
        cellEl.textContent = 'X';
        cellEl.style.color = '#3b82f6';
        cellEl.style.textShadow = '0 0 15px rgba(59,130,246,0.8)';
        cellEl.style.borderColor = 'rgba(59,130,246,0.5)';
        
        let winner = window.checkTTTWin(board);
        if(winner) { window.handleGameOver(winner); return; }
        
        // دور البوت
        isPlayerTurn = false;
        document.getElementById('ttt-status').textContent = 'البوت بيفكر...';
        document.getElementById('ttt-status').style.color = 'var(--mt)';
        
        setTimeout(window.botMoveTTT, 600);
    };

    window.botMoveTTT = function() {
        if(!gameActive) return;
        
        let bestMove = window.findBestMove();
        board[bestMove] = 'O';
        
        const cells = document.querySelectorAll('#ttt-board > div');
        let cellEl = cells[bestMove];
        if(cellEl) {
            cellEl.textContent = 'O';
            cellEl.style.color = '#ef4444';
            cellEl.style.textShadow = '0 0 15px rgba(239,68,68,0.8)';
            cellEl.style.borderColor = 'rgba(239,68,68,0.5)';
        }
        
        let winner = window.checkTTTWin(board);
        if(winner) { window.handleGameOver(winner); return; }
        
        isPlayerTurn = true;
        document.getElementById('ttt-status').textContent = 'دورك! أنت (X)';
        document.getElementById('ttt-status').style.color = 'var(--p1)';
    };

    window.checkTTTWin = function(b) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(let i=0; i<lines.length; i++) {
            let [a, c, d] = lines[i];
            if(b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
        }
        if(!b.includes('')) return 'Tie';
        return null;
    };

    window.handleGameOver = function(winner) {
        gameActive = false;
        const statusEl = document.getElementById('ttt-status');
        
        if(winner === 'X') {
            statusEl.textContent = '🎉 مبروك! أنت كسبت!';
            statusEl.style.color = 'var(--ok)';
            if(typeof fireConfetti === 'function') fireConfetti();
            
            // طلب المكافأة من السيرفر
            fetch('/api/web/arcade/reward', {method:'POST', headers: H})
                .then(r => r.json())
                .then(d => {
                    if(d.ok) {
                        if(typeof tst === 'function') tst('🎁 تم إضافة 50 نقطة لرصيدك', 'ok');
                        const tp = document.getElementById('tp');
                        if(tp && !S.o) {
                            const c = parseInt(tp.textContent) || 0;
                            tp.textContent = (c + 50) + ' 🪙';
                        }
                    } else {
                        if(typeof tst === 'function') tst('⚠️ ' + d.error, 'er');
                    }
                }).catch(()=>{});
                
        } else if(winner === 'O') {
            statusEl.textContent = '🤖 البوت كسب! حظ أوفر المرة الجاية.';
            statusEl.style.color = 'var(--dn)';
        } else {
            statusEl.textContent = '🤝 تعادل!';
            statusEl.style.color = 'var(--wn)';
        }
    };

    // خوارزمية البوت (Minimax بسيطة)
    window.findBestMove = function() {
        // 1. هل البوت يقدر يكسب؟
        for(let i=0; i<9; i++) {
            if(board[i] === '') {
                board[i] = 'O';
                if(window.checkTTTWin(board) === 'O') { board[i] = ''; return i; }
                board[i] = '';
            }
        }
        // 2. هل اللاعب هيكسب؟ نمنعه
        for(let i=0; i<9; i++) {
            if(board[i] === '') {
                board[i] = 'X';
                if(window.checkTTTWin(board) === 'X') { board[i] = ''; return i; }
                board[i] = '';
            }
        }
        // 3. خد النص
        if(board[4] === '') return 4;
        // 4. خد الأركان
        const corners = [0, 2, 6, 8];
        let availableCorners = corners.filter(c => board[c] === '');
        if(availableCorners.length > 0) return availableCorners[Math.floor(Math.random() * availableCorners.length)];
        
        // 5. أي حاجة فاضية
        let empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
        return empty[Math.floor(Math.random() * empty.length)];
    };
});
</script>


<script id="gift_store_logic">
document.addEventListener("DOMContentLoaded", function() {
    // 1. تعديل واجهة المتجر لإضافة زرار الهدية
    let originalSwitchStoreTab = window.switchStoreTab;
    window.switchStoreTab = function(el, tab) {
        originalSwitchStoreTab(el, tab);
        
        // نستنى الكروت تترسم وبعدين نضيف الزراير
        setTimeout(() => {
            let cards = document.querySelectorAll('#store_content .sc');
            cards.forEach((card, index) => {
                if(card.querySelector('.gift-btn')) return; // لو اتضاف قبل كده
                
                let giftBtn = document.createElement('button');
                giftBtn.className = 'gift-btn';
                giftBtn.innerHTML = '<i class="ph ph-gift"></i> إهداء';
                giftBtn.style.cssText = 'position:absolute; top:10px; right:10px; background:rgba(139,92,246,0.2); border:1px solid var(--p1); color:var(--p1); padding:4px 8px; border-radius:8px; font-size:10px; font-weight:900; cursor:pointer; z-index:10; display:flex; align-items:center; gap:4px; transition:0.2s; font-family:Cairo,sans-serif;';
                giftBtn.onmouseover = function() { this.style.background = 'var(--p1)'; this.style.color = '#fff'; };
                giftBtn.onmouseout = function() { this.style.background = 'rgba(139,92,246,0.2)'; this.style.color = 'var(--p1)'; };
                
                giftBtn.onclick = function(e) {
                    e.stopPropagation(); // عشان ميفتحش الشراء العادي
                    
                    // نعرف إحنا في أنهي تبويب وإيه بيانات الكارت
                    let type, itemId, price, title;
                    let onclickAttr = card.getAttribute('onclick');
                    
                    if(onclickAttr && onclickAttr.includes('buyVIP')) {
                        type = 'vip';
                        let match = onclickAttr.match(/buyVIP\((\d+),\s*(\d+)\)/);
                        if(match) { itemId = match[1]; price = match[2]; }
                        title = card.querySelector('h4').textContent;
                    } else if(onclickAttr && onclickAttr.includes('buyTheme')) {
                        type = 'theme';
                        let match = onclickAttr.match(/buyTheme\('([^']+)',\s*(\d+)\)/);
                        if(match) { itemId = match[1]; price = match[2]; }
                        title = card.querySelector('div[style*="font-size:12px"]').textContent || 'سمة';
                    } else if(onclickAttr && onclickAttr.includes('buyBadge')) {
                        type = 'badge';
                        let match = onclickAttr.match(/buyBadge\('([^']+)',\s*(\d+)\)/);
                        if(match) { itemId = match[1]; price = match[2]; }
                        title = card.querySelector('h4').textContent;
                    }
                    
                    if(type && itemId) {
                        showGiftModal(type, itemId, price, title);
                    }
                };
                
                // لازم الكارت يكون position relative عشان الزرار يظهر فوقه
                card.style.position = 'relative';
                card.appendChild(giftBtn);
            });
        }, 100);
    };

    // 2. شاشة الإهداء
    window.showGiftModal = function(type, itemId, price, title) {
        let m = document.getElementById('_gift_modal');
        if(m) m.remove();
        
        m = document.createElement('div');
        m.id = '_gift_modal';
        m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:9999999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Cairo,sans-serif;direction:rtl';
        m.innerHTML = `
        <div style="background:linear-gradient(145deg, #0f1526, #1a1f3a);border:1px solid rgba(139,92,246,0.3);border-radius:20px;width:100%;max-width:380px;padding:24px;box-shadow:0 25px 50px rgba(0,0,0,0.8)">
            <div style="text-align:center;margin-bottom:20px;">
                <div style="font-size:40px; margin-bottom:10px; filter:drop-shadow(0 0 15px rgba(139,92,246,0.5))">🎁</div>
                <h3 style="color:#fff;font-size:18px;font-weight:900">إهداء هدية</h3>
                <p style="color:var(--mt);font-size:12px;margin-top:5px">أنت على وشك إهداء <b style="color:var(--p1)">${title}</b> بقيمة <b style="color:var(--wn)">${price} نقطة</b></p>
            </div>
            
            <label style="color:var(--mt);font-size:11px;font-weight:800;margin-bottom:6px;display:block">🆔 ID صديقك</label>
            <input type="text" id="_gift_target" placeholder="اكتب ID المستخدم هنا..." style="width:100%;background:rgba(0,0,0,0.5);border:1px solid var(--bd);padding:14px;border-radius:12px;color:#fff;font-size:16px;text-align:center;margin-bottom:20px;outline:none;box-sizing:border-box;font-family:monospace">
            
            <div style="display:flex;gap:10px">
                <button onclick="document.getElementById('_gift_modal').remove()" style="flex:1;padding:12px;background:rgba(255,255,255,0.05);color:#fff;border:1px solid var(--bd);border-radius:10px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif">إلغاء</button>
                <button onclick="executeGift('${type}', '${itemId}', ${price})" style="flex:2;padding:12px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:none;border-radius:10px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif">تأكيد الإهداء</button>
            </div>
        </div>`;
        document.body.appendChild(m);
    };

    // 3. تنفيذ الإهداء
    window.executeGift = async function(type, itemId, price) {
        const targetId = document.getElementById('_gift_target').value.trim();
        if(!targetId) { if(typeof tst === 'function') tst('❌ اكتب ID المستخدم', 'er'); return; }
        
        const btn = document.querySelector('#_gift_modal button:last-child');
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'جاري الإهداء...';
        
        try {
            const r = await fetch('/api/web/store/gift', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({type: type, item_id: itemId, target_id: targetId, price: price})
            });
            const d = await r.json();
            
            if(d.error) {
                if(typeof tst === 'function') tst('❌ ' + d.error, 'er');
            } else {
                if(typeof fireConfetti === 'function') fireConfetti();
                if(typeof tst === 'function') tst('🎁 تم إهداء الهدية بنجاح!', 'ok');
                document.getElementById('_gift_modal').remove();
                
                // تحديث الرصيد
                const tp = document.getElementById('tp');
                if(tp && !S.o) tp.textContent = d.new_balance + ' 🪙';
            }
        } catch(e) {
            if(typeof tst === 'function') tst('فشل الاتصال', 'er');
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    };
});
</script>


<script id="calendar_logic">
document.addEventListener("DOMContentLoaded", function() {
    // 1. إنشاء الحاوية
    setInterval(function() {
        let mn = document.querySelector('.mn');
        if (mn && !document.getElementById('v-calendar')) {
            let div = document.createElement('div');
            div.className = 'vw';
            div.id = 'v-calendar';
            div.innerHTML = '<div class="pi" id="pg-calendar"></div>';
            mn.appendChild(div);
        }
    }, 500);

    // 2. حقن الزر
    setInterval(function() {
        let navElement = document.getElementById('nav');
        if (navElement && !document.getElementById('nv-calendar')) {
            let groups = navElement.querySelectorAll('.grp');
            let rewardsGroup = Array.from(groups).find(g => g.textContent.trim() === 'المكافآت');
            
            let newBtn = document.createElement('div');
            newBtn.className = 'nv';
            newBtn.id = 'nv-calendar';
            newBtn.onclick = function() { g('calendar'); };
            newBtn.innerHTML = '<i class="ph ph-calendar-check"></i> تقويم المكافآت';

            if (rewardsGroup) {
                rewardsGroup.insertAdjacentElement('afterend', newBtn);
            } else {
                navElement.appendChild(newBtn);
            }
        }
    }, 1000);

    // 3. دالة عرض الصفحة
    window.r_calendar = async function() {
        const el = document.getElementById('pg-calendar');
        if(!el) return;
        
        el.innerHTML = `
        <div class="pt"><i class="ph ph-calendar-check" style="color:var(--p2)"></i> تقويم المكافآت</div>
        <div id="calendar-content" style="text-align:center; color:var(--mt); padding:20px">جاري التحميل...</div>
        `;
        
        window.loadCalendar();
    };

    window.loadCalendar = async function() {
        try {
            const r = await fetch('/api/web/calendar/status', {headers: H});
            const d = await r.json();
            const c = document.getElementById('calendar-content');
            if(!c) return;
            
            const rewards = d.rewards;
            const streak = d.streak;
            const claimed = d.claimed_today;
            const nextDay = d.next_day; // 1 to 7
            
            let html = '';
            
            // ═══ شريط الحالة ═══
            html += `
            <div style="background:linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.1)); border:1px solid rgba(59,130,246,0.3); border-radius:16px; padding:15px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div style="font-size:12px; color:var(--mt); font-weight:700">الستريك الحالي 🔥</div>
                    <div style="font-size:24px; color:var(--p1); font-weight:900;">${streak} / 7 أيام</div>
                </div>
                <div style="text-align:left;">
                    <div style="font-size:12px; color:var(--mt); font-weight:700">الحالة</div>
                    <div style="font-size:14px; color:${claimed ? 'var(--ok)' : 'var(--wn)'}; font-weight:900;">${claimed ? '✅ تم الاستلام اليوم' : '⏳ متاح الآن'}</div>
                </div>
            </div>
            `;
            
            // ═══ شبكة الأيام ═══
            html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px; margin-bottom:20px;">';
            
            for(let i=0; i<7; i++) {
                const dayNum = i + 1;
                const isCurrent = (dayNum === nextDay && !claimed) || (dayNum === streak && claimed);
                const isPast = dayNum < nextDay || (dayNum <= streak && claimed);
                const isLocked = dayNum > nextDay && !claimed;
                const isLast = dayNum === 7;
                
                let cardBg = 'rgba(0,0,0,0.2)';
                let borderColor = 'var(--bd)';
                let opacity = '0.5';
                let icon = '🔒';
                
                if (isCurrent) {
                    cardBg = isLast ? 'linear-gradient(180deg, rgba(245,158,11,0.2), rgba(0,0,0,0))' : 'linear-gradient(180deg, rgba(139,92,246,0.2), rgba(0,0,0,0))';
                    borderColor = isLast ? 'var(--wn)' : 'var(--p1)';
                    opacity = '1';
                    icon = '🎁';
                } else if (isPast) {
                    cardBg = 'rgba(16,185,129,0.1)';
                    borderColor = 'var(--ok)';
                    opacity = '0.8';
                    icon = '✅';
                } else if (isLocked) {
                    icon = '🔒';
                }
                
                html += `
                <div onclick="${isCurrent ? 'window.claimCalendarReward()' : ''}" style="
                    background: ${cardBg};
                    border: 2px solid ${borderColor};
                    border-radius: 14px;
                    padding: 15px 10px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                    opacity: ${opacity};
                    cursor: ${isCurrent ? 'pointer' : 'default'};
                    transition: 0.3s;
                    position: relative;
                    ${isCurrent ? 'animation: pulse 2s infinite; box-shadow: 0 0 20px ' + (isLast ? 'rgba(245,158,11,0.4)' : 'rgba(139,92,246,0.3)') + ';' : ''}
                " ${isCurrent ? 'onmouseover="this.style.transform=\'scale(1.05)\'"' : ''} ${isCurrent ? 'onmouseout="this.style.transform=\'scale(1)\'"' : ''}>
                    <div style="font-size:10px; color:${isCurrent ? '#fff' : 'var(--mt)'}; font-weight:900;">اليوم ${dayNum}</div>
                    <div style="font-size:30px; filter: ${isLocked ? 'grayscale(100%)' : 'none'}">${icon}</div>
                    <div style="font-size:12px; color:${isLast ? 'var(--wn)' : (isCurrent ? 'var(--p1)' : 'var(--mt)')}; font-weight:900;">+${rewards[i]}</div>
                    ${isLast ? '<div style="font-size:8px; color:var(--wn); margin-top:2px;">🎁 أسطوري</div>' : ''}
                </div>
                `;
            }
            html += '</div>';
            
            // ═══ زرار الاستلام ═══
            if (!claimed) {
                html += `
                <button onclick="window.claimCalendarReward()" style="width:100%; padding:15px; background:linear-gradient(135deg, var(--p1), var(--p2)); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:900; font-family:Cairo,sans-serif; cursor:pointer; box-shadow:0 10px 20px rgba(139,92,246,0.3); display:flex; justify-content:center; align-items:center; gap:10px;">
                    <i class="ph ph-gift"></i> استلام مكافأة اليوم ${nextDay}
                </button>
                `;
            } else {
                html += `
                <div style="width:100%; padding:15px; background:rgba(16,185,129,0.1); color:var(--ok); border:1px solid var(--ok); border-radius:14px; font-size:14px; font-weight:900; text-align:center;">
                    ✅ لقد استلمت مكافأة اليوم. عد غداً لمكافأة أكبر!
                </div>
                `;
            }
            
            c.innerHTML = html;
        } catch(e) {}
    };

    window.claimCalendarReward = async function() {
        try {
            const r = await fetch('/api/web/calendar/claim', {method: 'POST', headers: H});
            const d = await r.json();
            
            if(d.error) {
                if(typeof tst === 'function') tst('❌ ' + d.error, 'er');
            } else {
                if(typeof fireConfetti === 'function') fireConfetti();
                if(typeof tst === 'function') tst('🎁 تم استلام ' + d.reward + ' نقطة بنجاح!', 'ok');
                
                // تحديث الرصيد
                const tp = document.getElementById('tp');
                if(tp && !S.o) {
                    const c = parseInt(tp.textContent) || 0;
                    tp.textContent = (c + d.reward) + ' 🪙';
                }
                
                window.loadCalendar(); // إعادة تحميل التقويم
            }
        } catch(e) {
            if(typeof tst === 'function') tst('فشل الاتصال', 'er');
        }
    };
});
</script>

                return;
            }
            
            const u = d.user;
            const isBanned = u.role === 'BANNED'; // افتراضي، ممكن نعدلها حسب دالة الحظر
            
            container.innerHTML = `

        let val = 0;
        if(action === 'add_points' || action === 'remove_points') {
            val = document.getElementById('admin-points-val').value;
            if(!val || isNaN(val) || val <= 0) { if(typeof tst === 'function') tst('❌ أدخل عدد نقاط صحيح', 'er'); return; }
        }
        
        try {
            const r = await fetch('/api/web/admin/user_manage', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({target_id: targetId, action: action, value: val})

            if(d.error) {
                if(typeof tst === 'function') tst('❌ ' + d.error, 'er');
            } else {
                if(typeof tst === 'function') tst('✅ تم تنفيذ الإجراء بنجاح', 'ok');

            }
        } catch(e) {
            if(typeof tst === 'function') tst('فشل الاتصال', 'er');
        }
    };
});

        <div class="g2" style="margin-bottom:15px">

            <!-- تحميل الداتابيز -->

                <h3 style="color:#fff;font-size:14px;margin-bottom:15px">النسخ الاحتياطي</h3>
                <button onclick="window.location.href='/api/web/admin/control/backup'" style="width:100%; padding:10px; background:linear-gradient(135deg, var(--p1), var(--p2)); color:#fff; border:none; border-radius:10px; font-weight:900; cursor:pointer; font-family:Cairo,sans-serif; font-size:12px;">📥 تحميل الداتابيز</button>

            <textarea id="bc-message" rows="3" placeholder="اكتب رسالتك هنا ليتم إرسالها لكل المستخدمين..." style="width:100%; background:rgba(0,0,0,0.5); border:1px solid var(--bd); padding:12px; border-radius:10px; color:#fff; font-size:13px; margin-bottom:10px; outline:none; resize:none; box-sizing:border-box; font-family:Cairo,sans-serif;"></textarea>

                <div style="font-size:11px;color:var(--mt)">لتطبيق أي تعديلات جديدة فوراً</div>
            </div>
            <button onclick="window.clearCache(this)" style="padding:10px 20px; background:rgba(16,185,129,0.2); color:var(--ok); border:1px solid var(--ok); border-radius:10px; font-weight:900; cursor:pointer; font-family:Cairo,sans-serif;">تنظيف</button>

    window.toggleMaintenance = async function(active) {
        try {
            const r = await fetch('/api/web/admin/control/maintenance', {

                body: JSON.stringify({active: active})
            });
            const d = await r.json();
            if(d.ok) {
                document.getElementById('maint-status').textContent = active ? 'الموقع تحت الصيانة 🚫' : 'الموقع يعمل بشكل طبيعي ✅';

            }
        } catch(e) {}
    };

    window.sendBroadcast = async function(btn) {
        const msg = document.getElementById('bc-message').value.trim();
        if(!msg) { if(typeof tst === 'function') tst('❌ اكتب الرسالة أولاً', 'er'); return; }
        
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ جاري الإرسال...';
        
        try {
            const r = await fetch('/api/web/admin/control/broadcast', {
                method: 'POST', headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({message: msg})
            });
            const d = await r.json();
            if(d.ok) {
                if(typeof tst === 'function') tst('✅ تم الإرسال لـ ' + d.sent + ' مستخدم', 'ok');

                document.getElementById('bc-message').value = '';
            } else {
                if(typeof tst === 'function') tst('❌ ' + d.error, 'er');
            }
        } catch(e) { if(typeof tst === 'function') tst('فشل الاتصال', 'er'); }
        finally { btn.disabled = false; btn.innerHTML = original; }
    };

    window.clearCache = async function(btn) {
        const original = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '...';
        try {
            await fetch('/api/web/admin/control/clear_cache', {method: 'POST', headers: H});
            if(typeof tst === 'function') tst('✅ تم تنظيف الكاش بنجاح', 'ok');
        } catch(e) {}
        finally { btn.disabled = false; btn.innerHTML = original; }
    };

    // ═══ 5. شاشة الصيانة للمستخدمين ═══
    async function checkMaintenance() {
        if(S.o) return; // المالك مش هيتأثر
        try {
            const r = await fetch('/api/web/admin/control/status', {headers: H});
            const d = await r.json();
            if(d.maintenance) {
                let overlay = document.getElementById('_maint_overlay');
                if(!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = '_maint_overlay';
                    overlay.style.cssText = 'position:fixed;inset:0;background:#030510;z-index:99999999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:Cairo,sans-serif;';
                    overlay.innerHTML = `
                        <div style="font-size:80px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(239,68,68,0.5))">🛠️</div>
                        <h1 style="color:#fff;font-size:24px;font-weight:900;margin-bottom:10px">الموقع تحت الصيانة</h1>
                        <p style="color:#94a3b8;font-size:14px;max-width:300px;line-height:1.6">نقوم حالياً بإجراء بعض التحديثات لتحسين الخدمة. يرجى العودة قريباً.</p>
                        <div style="margin-top:30px;font-size:12px;color:#475569">Spider AI Team</div>
                    `;
                    document.body.appendChild(overlay);
                }
            } else {
                let overlay = document.getElementById('_maint_overlay');
                if(overlay) overlay.remove();
            }
        } catch(e) {}
    }
    
    setTimeout(checkMaintenance, 2000);
    setInterval(checkMaintenance, 30000); // كل 30 ثانية
});
</script>


<script id="personal_activity_logic">
document.addEventListener("DOMContentLoaded", function() {
    // 1. إنشاء الحاوية
    setInterval(function() {
        let mn = document.querySelector('.mn');
        if (mn && !document.getElementById('v-my_activity')) {
            let div = document.createElement('div');
            div.className = 'vw';
            div.id = 'v-my_activity';
            div.innerHTML = '<div class="pi" id="pg-my_activity"></div>';
            mn.appendChild(div);
        }
    }, 500);

    // 2. حقن الزر في القائمة
    setInterval(function() {
        let navElement = document.getElementById('nav');
        if (navElement && !document.getElementById('nv-my_activity')) {
            let groups = navElement.querySelectorAll('.grp');
            let accountGroup = Array.from(groups).find(g => g.textContent.trim() === 'الحساب');
            
            let newBtn = document.createElement('div');
            newBtn.className = 'nv';
            newBtn.id = 'nv-my_activity';
            newBtn.onclick = function() { g('my_activity'); };
            newBtn.innerHTML = '<i class="ph ph-clock-counter-clockwise"></i> سجل نشاطي';

            if (accountGroup) {
                accountGroup.insertAdjacentElement('afterend', newBtn);
            } else {
                navElement.appendChild(newBtn);
            }
        }
    }, 1000);

    // 3. دالة عرض الصفحة
    window.r_my_activity = async function() {
        const el = document.getElementById('pg-my_activity');
        if(!el) return;
        
        el.innerHTML = `
        <div class="pt"><i class="ph ph-clock-counter-clockwise" style="color:var(--p2)"></i> سجل النشاط الشخصي</div>
        <div id="my-activity-list" style="position:relative; padding-right:20px; margin-top:20px;">
            <div style="position:absolute; top:0; right:6px; bottom:0; width:2px; background:var(--bd);"></div>
            <div style="text-align:center; color:var(--mt); padding:20px;">جاري التحميل...</div>
        </div>
        `;
        
        window.loadMyActivity();
    };

    // 4. تحميل البيانات
    window.loadMyActivity = async function() {
        try {
            const r = await fetch('/api/web/my_activity', {headers: H});
            const d = await r.json();
            const list = document.getElementById('my-activity-list');
            if(!list) return;
            
            if(!d.activities || d.activities.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--mt); padding:20px;">لا توجد نشاطات مسجلة حتى الآن.</div>';
                return;
            }
            
            list.innerHTML = d.activities.map(a => {
                // تحديد الأيقونة واللون حسب نوع النشاط
                let icon = 'ph-info'; let color = 'var(--p1)';
                let actionText = a.action;
                
                if(actionText.includes('scrape') || actionText.includes('Scrape')) { icon = 'ph-spider'; color = '#8b5cf6'; actionText = 'عملية سحب'; }
                else if(actionText.includes('pump') || actionText.includes('Pump')) { icon = 'ph-rocket'; color = '#3b82f6'; actionText = 'عملية ضخ'; }
                else if(actionText.includes('VIP') || actionText.includes('vip')) { icon = 'ph-crown'; color = '#f59e0b'; actionText = 'شراء VIP'; }
                else if(actionText.includes('Transfer') || actionText.includes('transfer')) { icon = 'ph-paper-plane-tilt'; color = '#10b981'; actionText = 'تحويل نقاط'; }
                else if(actionText.includes('Badge')) { icon = 'ph-medal'; color = '#ec4899'; actionText = 'شراء شارة'; }
                else if(actionText.includes('Theme')) { icon = 'ph-palette'; color = '#0ea5e9'; actionText = 'شراء سمة'; }
                
                // تنسيق التاريخ
                let dateStr = '';
                if(a.created_at) {
                    let parts = a.created_at.split(' ');
                    dateStr = parts[0] + ' | ' + parts[1].substring(0,5);
                }
                
                return `
                <div style="position:relative; margin-bottom:20px; padding-right:25px;">
                    <!-- النقطة على الخط -->
                    <div style="position:absolute; right:-2px; top:5px; width:16px; height:16px; border-radius:50%; background:var(--pn); border:3px solid ${color}; box-shadow:0 0 10px ${color}80; z-index:2;"></div>
                    
                    <!-- الكارت -->
                    <div style="background:linear-gradient(90deg, ${color}10, transparent); border:1px solid var(--bd); border-radius:12px; padding:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <i class="ph ${icon}" style="color:${color}; font-size:16px;"></i>
                                <span style="font-size:13px; font-weight:900; color:#fff;">${actionText}</span>
                            </div>
                            <span style="font-size:10px; color:var(--mt); font-family:monospace;">${dateStr}</span>
                        </div>
                        <div style="font-size:11px; color:var(--mt);">${a.details || ''}</div>
                    </div>
                </div>`;
            }).join('');
        } catch(e) {
            document.getElementById('my-activity-list').innerHTML = '<div style="text-align:center; color:var(--dn); padding:20px;">فشل تحميل السجل</div>';
        }
    };
});
</script>

        try {
            const r = await fetch('/api/web/vip/lounge/claim', {method: 'POST', headers: H});

            btn.innerHTML = original;

    window.loadVipChat = async function() {
        try {
            // هنستخدم نفس API الشات بس هنبعتله نوع الروم (vip)

            if(!box) return;

                return;
            }
            
            const myId = S.u ? String(S.u.id) : '';
            
            box.innerHTML = d.messages.map(m => {
                const isMe = (String(m.user_id) === myId);
                const bg = isMe ? 'linear-gradient(135deg, #f59e0b, #d97706)' : 'var(--cd)';
                const align = isMe ? 'flex-end' : 'flex-start';
                const radius = isMe ? '15px 15px 0 15px' : '15px 15px 15px 0';
                const color = isMe ? '#fff' : 'var(--tx)';
                const time = m.created_at ? m.created_at.split(' ')[1].substring(0,5) : '';

                <div style="display:flex; flex-direction:column; align-items:${align}; width:100%">
                    <div style="font-size:10px; color:var(--mt); margin-bottom:3px; margin-${isMe ? 'left' : 'right'}:5px">

                    <div style="background:${bg}; color:${color}; padding:10px 14px; border-radius:${radius}; max-width:80%; font-size:13px; line-height:1.5; box-shadow:0 2px 5px rgba(0,0,0,0.2); word-break:break-word;">
                        ${escapeHtmlVip(m.message)}
                    </div>
                </div>`;
            }).join('');
            
            box.scrollTop = box.scrollHeight;
        } catch(e) {}
    };

    window.sendVipMessage = async function() {
        const input = document.getElementById('vip-chat-input');
        if(!input) return;
        const msg = input.value.trim();
        if(!msg) return;
        
        input.value = '';
        input.disabled = true;
        
        try {
            await fetch('/api/web/global_chat/send', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({message: msg, room: 'vip'})
            });
            window.loadVipChat();
        } catch(e) {} finally {
            input.disabled = false;
            input.focus();
        }
    };

    function escapeHtmlVip(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
});
</script>

<script id="chat_ui_boost">
document.addEventListener("DOMContentLoaded", function() {
    window.enhanceChatMessages = function() {
        document.querySelectorAll('.mb').forEach(bubble => {
            // 1. تحسين بلوكات الكود وإضافة زرار نسخ
            bubble.querySelectorAll('pre').forEach(pre => {
                if(pre.querySelector('.copy-code-btn')) return;
                pre.style.position = 'relative';
                
                let btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.innerHTML = '<i class="ph ph-copy"></i> نسخ';
                btn.style.cssText = 'position:absolute; top:5px; left:5px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px 8px; border-radius:6px; font-size:10px; cursor:pointer; font-family:Cairo,sans-serif; transition:0.2s; z-index:10;';
                btn.onmouseover = () => btn.style.background = 'rgba(139,92,246,0.8)';
                btn.onmouseout = () => btn.style.background = 'rgba(255,255,255,0.1)';
                
                btn.onclick = function(e) {
                    e.stopPropagation();
                    let codeText = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
                    navigator.clipboard.writeText(codeText).then(() => {
                        btn.innerHTML = '<i class="ph ph-check"></i> تم';
                        if(typeof tst === 'function') tst('✅ تم نسخ الكود', 'ok');
                        setTimeout(() => btn.innerHTML = '<i class="ph ph-copy"></i> نسخ', 2000);
                    });
                };
                pre.appendChild(btn);
            });

            // 2. إضافة أزرار (استماع / إعادة توليد) تحت رد البوت
            if(bubble.parentElement.classList.contains('a')) {
                if(bubble.querySelector('.msg-actions')) return; // لو اتضافت قبل كده
                
                let actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.style.cssText = 'display:flex; gap:10px; margin-top:8px; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px;';
                
                // نستخرج النص قبل إضافة الأزرار عشان الاستماع ميقرهاش
                let rawText = bubble.innerText.trim(); 
                
                let ttsBtn = document.createElement('button');
                ttsBtn.innerHTML = '<i class="ph ph-speaker-high"></i> استماع';
                ttsBtn.style.cssText = 'background:none; border:none; color:var(--p1); font-size:10px; font-family:Cairo,sans-serif; cursor:pointer; display:flex; align-items:center; gap:4px;';
                ttsBtn.onclick = function() { if(typeof playTTS === 'function') playTTS(this, rawText); };
                
                let regenBtn = document.createElement('button');
                regenBtn.innerHTML = '<i class="ph ph-arrows-clockwise"></i> إعادة توليد';
                regenBtn.style.cssText = 'background:none; border:none; color:var(--mt); font-size:10px; font-family:Cairo,sans-serif; cursor:pointer; display:flex; align-items:center; gap:4px; margin-right:auto;';
                
                // ═══ المنطق الجديد لإعادة التوليد ═══
                regenBtn.onclick = function(e) {
                    e.stopPropagation();
                    let msgDiv = bubble.parentElement; // الـ div بتاع رد البوت
                    let prev = msgDiv.previousElementSibling;
                    let prompt = "";
                    
                    // بندور على الرسالة السابقة اللي كتبها المستخدم
                    while(prev) {
                        if(prev.classList.contains('u')) {
                            let mb = prev.querySelector('.mb');
                            if(mb) prompt = mb.innerText;
                            break;
                        }
                        prev = prev.previousElementSibling;
                    }
                    
                    if(prompt) {
                        let inp = document.getElementById('inp');
                        let sndBtn = document.getElementById('sb2');
                        
                        // لو مفيش عملية شغالة دلوقتي، ابعت الرسالة تاني
                        if(inp && sndBtn && !sndBtn.disabled) {
                            inp.value = prompt;
                            if(typeof snd === 'function') snd();
                        } else if (sndBtn && sndBtn.disabled) {
                            if(typeof tst === 'function') tst('جاري الرد حالياً، انتظر...', 'er');
                        }
                    } else {
                        if(typeof tst === 'function') tst('مش لاقي السؤال الأصلي!', 'er');
                    }
                };
                
                actions.appendChild(ttsBtn);
                actions.appendChild(regenBtn);
                bubble.appendChild(actions);
            }
        });
    };

    // مراقبة الشات عشان نحسن الرسائل أول ما تظهر
    setInterval(window.enhanceChatMessages, 1500);
});
</script>

document.addEventListener("DOMContentLoaded", function() {

    setInterval(function() {
        let mn = document.querySelector('.mn');
        if (mn && !document.getElementById('v-auctions')) {
            let div = document.createElement('div');
            div.className = 'vw';
            div.id = 'v-auctions';
            div.innerHTML = '<div class="pi" id="pg-auctions"></div>';
            mn.appendChild(div);
        }
    }, 500);

    // 2. حقن الزر
    setInterval(function() {
        let navElement = document.getElementById('nav');
        if (navElement && !document.getElementById('nv-auctions')) {
            let groups = navElement.querySelectorAll('.grp');
            let rewardsGroup = Array.from(groups).find(g => g.textContent.trim() === 'المكافآت');
            
            let newBtn = document.createElement('div');
            newBtn.className = 'nv';
            newBtn.id = 'nv-auctions';
            newBtn.onclick = function() { g('auctions'); };
            newBtn.innerHTML = '<i class="ph ph-gavel" style="color:#ef4444"></i> دار المزاد';

            if (rewardsGroup) {
                rewardsGroup.insertAdjacentElement('afterend', newBtn);
            } else {
                navElement.appendChild(newBtn);
            }
        }
    }, 1000);

    // 3. دالة عرض الصفحة
    window.r_auctions = async function() {
        const el = document.getElementById('pg-auctions');
        if(!el) return;
        
        let ownerBtn = S.o ? `<button onclick="showCreateAuction()" class="bt" style="padding:8px 15px;font-size:12px;margin-bottom:15px"><i class="ph ph-plus"></i> مزاد جديد</button>` : '';
        
        el.innerHTML = `
        <div class="pt" style="display:flex;justify-content:space-between;align-items:center">
            <div><i class="ph ph-gavel" style="color:#ef4444"></i> دار المزاد</div>
            ${ownerBtn}
        </div>
        <div id="auctions-list" style="display:flex;flex-direction:column;gap:15px">
            <div class="cd" style="text-align:center;color:var(--mt);padding:20px">جاري التحميل...</div>
        </div>
        `;
        
        window.loadAuctions();
        if(window._aucInterval) clearInterval(window._aucInterval);
        window._aucInterval = setInterval(window.loadAuctions, 5000); // تحديث كل 5 ثواني
    };

    // 4. تحميل المزادات
    window.loadAuctions = async function() {
        try {
            const r = await fetch('/api/web/auctions/list', {headers: H});
            const d = await r.json();
            const list = document.getElementById('auctions-list');
            if(!list) { clearInterval(window._aucInterval); return; }
            
            if(!d.auctions || d.auctions.length === 0) {
                list.innerHTML = '<div class="cd" style="text-align:center;color:var(--mt);padding:20px">لا توجد مزادات شغالة حالياً.</div>';
                return;
            }
            
            list.innerHTML = d.auctions.map(a => {
                let current = a.current_bid || a.start_price;
                let bidder = a.current_bidder ? a.current_bidder.slice(-5) : 'لا يوجد';
                let isTop = a.current_bidder === String(S.u.id);
                
                return `
                <div class="cd" style="padding:20px; background:linear-gradient(145deg, rgba(239,68,68,0.1), rgba(0,0,0,0)); border-color:rgba(239,68,68,0.4)">
                    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
                        <h3 style="color:#fff;font-size:16px;font-weight:900">${a.title}</h3>
                        <div style="font-size:11px;color:var(--wn);font-weight:900" class="auc-timer" data-end="${a.end_time}">⏳</div>
                    </div>
                    
                    <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px;margin-bottom:15px">
                        <div style="font-size:11px;color:var(--mt)">أعلى مزايد: <span style="color:${isTop ? 'var(--ok)' : 'var(--p1)'};font-weight:900">${isTop ? 'أنت' : bidder}</span></div>
                        <div style="font-size:18px;color:var(--wn);font-weight:900;font-family:monospace">${current.toLocaleString()} 🪙</div>
                    </div>
                    
                    <div style="display:flex;gap:10px">
                        <input type="number" id="bid-val-${a.id}" placeholder="مزايدتك..." style="flex:1;background:rgba(0,0,0,0.5);border:1px solid var(--bd);padding:10px;border-radius:10px;color:#fff;font-size:14px;outline:none;text-align:center">
                        <button onclick="window.placeBid(${a.id})" style="padding:0 20px;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;border:none;border-radius:10px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;box-shadow:0 4px 10px rgba(239,68,68,0.3)">زايد</button>
                    </div>
                </div>`;
            }).join('');
            
            window.updateTimers();
        } catch(e) {}
    };

    // 5. تحديث المؤقت
    window.updateTimers = function() {
        document.querySelectorAll('.auc-timer').forEach(el => {
            let end = new Date(el.dataset.end.replace(' ', 'T')).getTime();
            let now = new Date().getTime();
            let diff = end - now;
            
            if(diff <= 0) {
                el.innerHTML = 'انتهى';
                el.style.color = 'var(--dn)';
            } else {
                let h = Math.floor(diff / (1000 * 60 * 60));
                let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                let s = Math.floor((diff % (1000 * 60)) / 1000);
                el.innerHTML = `⏳ ${h}س ${m}د ${s}ث`;
            }
        });
        if(window.r_auctions && document.getElementById('pg-auctions')) {
            setTimeout(window.updateTimers, 1000);
        }
    };

    // 6. المزايدة
    window.placeBid = async function(id) {
        let val = document.getElementById(`bid-val-${id}`).value;
        if(!val || val <= 0) { if(typeof tst === 'function') tst('اكتب مبلغ صحيح', 'er'); return; }
        
        try {
            const r = await fetch('/api/web/auctions/bid', {
                method: 'POST', headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({id: id, amount: val})
            });
            const d = await r.json();
            if(d.error) {
                if(typeof tst === 'function') tst('❌ ' + d.error, 'er');
            } else {
                if(typeof tst === 'function') tst('✅ تم تسجيل مزايدتك!', 'ok');
                if(typeof fireConfetti === 'function') fireConfetti();
                window.loadAuctions();
            }
        } catch(e) {}
    };

            <label style="color:var(--mt);font-size:11px;font-weight:800;margin-bottom:4px;display:block">نوع الجايزة (points/vip/badge)</label>
            <input type="text" id="_auc_type" placeholder="points" style="width:100%;background:rgba(0,0,0,0.5);border:1px solid var(--bd);padding:10px;border-radius:8px;color:#fff;margin-bottom:10px;outline:none;box-sizing:border-box">

        const start_price = document.getElementById('_auc_start').value;

<script id="ai_pro_features">
document.addEventListener("DOMContentLoaded", function() {
    // ═══════════════════════════════════════════════════════
    // 1. الأوامر السريعة (Prompt Presets)
    // ═══════════════════════════════════════════════════════
    function injectQuickCommands() {
        let inputArea = document.getElementById('inp');
        if (!inputArea) return;
        let container = inputArea.closest('.cb'); // الحاوية بتاعة خانة الشات
        if (!container || document.getElementById('quick-commands')) return;

        let qcDiv = document.createElement('div');
        qcDiv.id = 'quick-commands';
        qcDiv.style.cssText = 'display:flex; gap:8px; overflow-x:auto; padding:10px 16px 0; scrollbar-width:none; -ms-overflow-style:none;';
        qcDiv.innerHTML = `
            <button onclick="window.setQuickPrompt('اكتب لي كود برمجي لـ ')">💻 كود</button>
            <button onclick="window.setQuickPrompt('ترجم النص التالي للعربية: ')">🌐 ترجمة</button>
            <button onclick="window.setQuickPrompt('لخص لي النص التالي: ')">📝 تلخيص</button>
            <button onclick="window.setQuickPrompt('اشرح لي المفهوم التالي ببساطة: ')">📖 شرح</button>
        `;
        
        // ستايل الأزرار
        qcDiv.querySelectorAll('button').forEach(btn => {
            btn.className = 'qc-btn';
            btn.style.cssText = 'padding:6px 12px; border-radius:10px; border:1px solid var(--bd); background:var(--cd); color:var(--tx); font-weight:700; font-size:11px; cursor:pointer; font-family:inherit; white-space:nowrap; transition:0.2s;';
            btn.onmouseover = () => { btn.style.background = 'rgba(139,92,246,0.2)'; btn.style.borderColor = 'var(--p1)'; };
            btn.onmouseout = () => { btn.style.background = 'var(--cd)'; btn.style.borderColor = 'var(--bd)'; };
        });

        container.insertBefore(qcDiv, container.firstChild);
    }

    // دالة إدخال الأمر في الخانة
    window.setQuickPrompt = function(promptText) {
        let input = document.getElementById('inp');
        if (input) {
            input.value = promptText;
            input.focus();
            // تعديل ارتفاع الخانة
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
        }
    };

    // ═══════════════════════════════════════════════════════
    // 2. المحادثة الصوتية (Speech-to-Text)
    // ═══════════════════════════════════════════════════════
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; // اللغة العربية
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            isRecording = true;
            let micBtn = document.getElementById('mic');
            if (micBtn) {
                micBtn.style.background = 'rgba(239,68,68,0.2)';
                micBtn.style.color = '#ef4444';
                micBtn.style.border = '1px solid #ef4444';
                micBtn.innerHTML = '<i class="ph ph-stop-circle"></i>';
            }
            if(typeof tst === 'function') tst('🎙️ جاري الاستماع...', 'ok');
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            let input = document.getElementById('inp');
            if (input) {
                input.value += (input.value ? ' ' : '') + transcript;
                input.style.height = 'auto';
                input.style.height = input.scrollHeight + 'px';
            }
        };

        recognition.onerror = function(event) {
            if(typeof tst === 'function') tst('❌ فشل التعرف على الصوت', 'er');
            stopRecordingUI();
        };

        recognition.onend = function() {
            stopRecordingUI();
        };
    }

    function stopRecordingUI() {
        isRecording = false;
        let micBtn = document.getElementById('mic');
        if (micBtn) {
            micBtn.style.background = 'transparent';
            micBtn.style.color = 'var(--mt)';
            micBtn.style.border = '1px solid var(--bd)';
            micBtn.innerHTML = '<i class="ph ph-microphone"></i>';
        }
    }

    // ربط الزرار بالكود الجديد
    let micBtnElement = document.getElementById('mic');
    if (micBtnElement) {
        // نشيل الحدث القديم ونحط الجديد
        micBtnElement.onclick = null;
        micBtnElement.addEventListener('click', function() {
            if (!recognition) {
                if(typeof tst === 'function') tst('المتصفح لا يدعم المحادثة الصوتية', 'er');
                return;
            }
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });
    }

    // مراقبة الصفحة عشان نحقن الأزرار أول ما الشات يفتح
    setInterval(injectQuickCommands, 1000);
});
</script>


<script id="ai_colors_fix">

    setTimeout(() => { if(typeof window.setAIMode === 'function') window.setAIMode(window.aiMode || 'fast'); }, 1000);

    function styleQuickCommands() {

<script id="ai_vision_logic">
document.addEventListener("DOMContentLoaded", function() {
    // استبدال دالة رفع الصورة القديمة (اللي كانت بترفع ملفات للـ AI العادي)
    window.upImg = async function(inp) {
        if(!inp.files[0]) return;
        const file = inp.files[0];
        
        if(!file.type.startsWith('image/')) {
            if(typeof tst === 'function') tst('❌ من فضلك اختر صورة (JPG/PNG)', 'er');
            return;
        }
        
        const b = document.getElementById('msgs');
        b.innerHTML += `<div class="m u"><div class="ma"><i class="ph ph-file"></i></div><div class="mb">📎 تحليل صورة: ${file.name}</div></div>`;
        b.scrollTop = b.scrollHeight;
        
        const id = 't' + Date.now();
        b.innerHTML += `<div class="m a" id="${id}"><div class="ma"><i class="ph ph-spider"></i></div><div class="mb"><div class="tp"><span></span><span></span><span></span></div><div style="font-size:11px;color:var(--mt);margin-top:5px">جاري تحليل الصورة...</div></div></div>`;
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;
            try {
                const r = await fetch('/api/web/ai_vision', {
                    method: 'POST',
                    headers: {...H, 'Content-Type':'application/json'},
                    body: JSON.stringify({image: base64})
                });
                const d = await r.json();
                document.getElementById(id).remove();
                
                if(d.error) {
                    b.innerHTML += `<div class="m a"><div class="ma" style="background:var(--dn)"><i class="ph ph-warning"></i></div><div class="mb" style="color:var(--dn)">${d.error}</div></div>`;
                } else {
                    b.innerHTML += `<div class="m a"><div class="ma"><i class="ph ph-spider"></i></div><div class="mb">${marked.parse(d.reply)}</div></div>`;
                    if(typeof fireConfetti === 'function') fireConfetti();
                }
            } catch(err) {
                document.getElementById(id).remove();
                b.innerHTML += `<div class="m a"><div class="mb" style="color:var(--dn)">فشل الاتصال</div></div>`;
            }
            inp.value = ''; // تفريغ الخانة عشان تقدر ترفع صورة تانية
            b.scrollTop = b.scrollHeight;
        };
        reader.readAsDataURL(file);
    };
});
</script>
