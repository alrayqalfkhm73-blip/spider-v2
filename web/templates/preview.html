<style>
*{font-family:Cairo,sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#030510;--pn:#0a0f1e;--cd:#0f1526;--bd:rgba(139,92,246,.2);--tx:#e8eefc;--mt:#64748b;--p1:#8b5cf6;--p2:#3b82f6;--ok:#10b981;--dn:#ef4444;--wn:#f59e0b}
body.lt{--bg:#f0f4f9;--pn:#fff;--cd:#f8fafc;--bd:rgba(99,102,241,.2);--tx:#0f172a}
body{background:var(--bg);color:var(--tx);height:100vh;height:100dvh;display:flex;overflow:hidden}
.sb{width:220px;background:var(--pn);border-left:1px solid var(--bd);position:fixed;right:0;top:0;bottom:0;z-index:100;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.sb.op{transform:none}
@media(min-width:768px){.sb{position:relative;transform:none}}
.sbh{padding:14px;border-bottom:1px solid var(--bd);font-weight:900;color:var(--p1);font-size:15px}
.sbn{flex:1;overflow-y:auto;padding:8px}
.grp{font-size:10px;color:var(--mt);font-weight:900;padding:4px 10px;letter-spacing:1px}
.nv{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;margin-bottom:1px;transition:all .15s}
.nv:hover{background:var(--cd)}
.nv.on{background:rgba(139,92,246,.15);color:var(--p1);border-right:3px solid var(--p1)}
.nv i{font-size:16px;transition:all .3s cubic-bezier(.4,0,.2,1);display:inline-block}.nv:hover i{transform:scale(1.2) rotate(-8deg);filter:drop-shadow(0 0 8px var(--p1))}.nv.on i{animation:iconPulse 2s infinite;filter:drop-shadow(0 0 10px var(--p1))}@keyframes iconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.sbf{padding:10px;border-top:1px solid var(--bd)}
.mn{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{min-height:52px;background:var(--pn);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));flex-shrink:0;backdrop-filter:blur(20px);position:relative;z-index:50}.tb::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--p1),transparent);opacity:.6}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}.ib:hover{transform:rotate(15deg) scale(1.1);color:var(--p1);border-color:var(--p1)}.ib:active{transform:scale(.9)}
.ib:hover{background:var(--p1);color:#fff}
.pts{background:rgba(245,158,11,.15);color:var(--wn);padding:4px 10px;border-radius:8px;font-weight:900;font-size:11px}
.vw{display:none;flex:1;overflow-y:auto;flex-direction:column}
.vw.on{display:flex;animation:pgIn .4s cubic-bezier(.4,0,.2,1)}@keyframes pgIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pi{max-width:900px;margin:0 auto;width:100%;padding:14px}
.pt{font-size:19px;font-weight:900;margin-bottom:12px;display:flex;gap:6px;align-items:center}
</style>

<style>
.profile-card{max-width:400px;margin:20px auto;border-radius:20px;padding:24px;text-align:center;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.profile-card.user{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #475569}
.profile-card.vip{background:linear-gradient(135deg,#b45309,#78350f,#451a03);border:2px solid #f59e0b;box-shadow:0 0 40px rgba(245,158,11,.5),0 20px 60px rgba(0,0,0,.6)}
.profile-card.vip::before{content:"";position:absolute;inset:-2px;background:linear-gradient(45deg,#f59e0b,#fbbf24,#f59e0b);z-index:-1;border-radius:22px;animation:rotate-glow 3s linear infinite}
.profile-card.owner{background:linear-gradient(135deg,#4c1d95,#1e1b4b,#0c0a1e);border:2px solid #8b5cf6;box-shadow:0 0 60px rgba(139,92,246,.7),0 20px 60px rgba(0,0,0,.6)}
.profile-card.owner::before{content:"";position:absolute;inset:-2px;background:linear-gradient(45deg,#8b5cf6,#3b82f6,#06b6d4,#8b5cf6);z-index:-1;border-radius:22px;animation:rotate-glow 3s linear infinite;background-size:300% 300%}
@keyframes rotate-glow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.profile-avatar{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;margin:0 auto 12px;position:relative;z-index:1}
.profile-card.user .profile-avatar{background:#334155;border:3px solid #64748b}
.profile-card.vip .profile-avatar{background:linear-gradient(135deg,#f59e0b,#d97706);border:3px solid #fbbf24;box-shadow:0 0 30px rgba(245,158,11,.8)}
.profile-card.owner .profile-avatar{background:linear-gradient(135deg,#8b5cf6,#3b82f6);border:3px solid #a78bfa;box-shadow:0 0 40px rgba(139,92,246,.9)}
.profile-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:900;margin-bottom:12px;position:relative;z-index:1}
.profile-card.user .profile-badge{background:#475569;color:#cbd5e1}
.profile-card.vip .profile-badge{background:#f59e0b;color:#000;box-shadow:0 0 20px rgba(245,158,11,.8)}
.profile-card.owner .profile-badge{background:linear-gradient(90deg,#8b5cf6,#3b82f6);color:#fff;box-shadow:0 0 20px rgba(139,92,246,.8);animation:pulse-badge 1.5s infinite}
@keyframes pulse-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.profile-name{font-size:18px;font-weight:900;margin-bottom:4px;position:relative;z-index:1}
.profile-id{font-size:11px;color:#94a3b8;margin-bottom:16px;position:relative;z-index:1;font-family:monospace}
.profile-stats{display:flex;gap:16px;justify-content:center;margin-top:16px;position:relative;z-index:1}
.profile-stat{background:rgba(0,0,0,.3);padding:12px 18px;border-radius:12px;flex:1}
.profile-stat-num{font-size:20px;font-weight:900;color:#f59e0b;font-family:monospace}
.profile-card.vip .profile-stat-num{color:#fbbf24;text-shadow:0 0 10px rgba(251,191,36,.5)}
.profile-card.owner .profile-stat-num{color:#a78bfa;text-shadow:0 0 15px rgba(167,139,250,.8)}
.profile-stat-lbl{font-size:9px;color:#94a3b8;margin-top:2px}
</style>

<style>
#cmd-palette{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:flex-start;justify-content:center;padding-top:80px}
#cmd-palette.on{display:flex;animation:fadeIn .2s}
.cmd-box{background:var(--pn);border:1px solid var(--bd);border-radius:14px;width:90%;max-width:560px;box-shadow:0 25px 80px rgba(0,0,0,.8);overflow:hidden}
.cmd-input{width:100%;padding:16px 20px;background:transparent;border:none;color:var(--tx);font-size:15px;outline:none;border-bottom:1px solid var(--bd);font-family:inherit}
.cmd-list{max-height:400px;overflow-y:auto}
.cmd-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;color:var(--tx);font-size:13px;font-weight:700;transition:background .1s}
.cmd-item:hover,.cmd-item.sel{background:rgba(139,92,246,.15)}
.cmd-item i{font-size:18px;color:var(--p1)}
.cmd-item .hint{margin-right:auto;font-size:10px;color:var(--mt);font-family:monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>

<style>
.ch{display:flex;flex-direction:column;height:calc(100vh - 52px);max-width:900px;margin:0 auto;width:100%}
.cm{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:8px}
.m.u{flex-direction:row-reverse}
.ma{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.m.a .ma{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.m.u .ma{background:var(--cd);border:1px solid var(--bd);color:var(--p2)}
.mb{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.7;word-break:break-word}
.m.u .mb{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-top-left-radius:4px}
.m.a .mb{background:var(--cd);border:1px solid var(--bd);border-top-right-radius:4px}
.mb pre{background:#000;border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0;direction:ltr;text-align:left;font-size:12px}
.mb code{font-family:monospace;font-size:12px;background:rgba(139,92,246,.15);padding:2px 5px;border-radius:3px}
.tp{display:flex;gap:4px;padding:4px 0}
.tp span{width:6px;height:6px;background:var(--p1);border-radius:50%;animation:bn 1.4s infinite}
.tp span:nth-child(2){animation-delay:.2s}
.tp span:nth-child(3){animation-delay:.4s}
@keyframes bn{0%,80%,100%{opacity:.5}40%{opacity:1;transform:translateY(-5px)}}
.ci{padding:0 16px 16px}
.cb{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:8px}
.cr{display:flex;gap:8px;align-items:flex-end}
.cr textarea{flex:1;background:none;border:none;color:var(--tx);resize:none;max-height:110px;padding:8px;outline:none;font-family:inherit;font-size:14px}
.snd{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:none;cursor:pointer;font-size:14px;margin-bottom:4px;transition:all .2s;position:relative;overflow:hidden}.snd:hover:not(:disabled){transform:scale(1.1);box-shadow:0 0 15px rgba(139,92,246,.6)}.snd:active:not(:disabled){transform:scale(.9)}
.snd:disabled{opacity:.4}
.mic{width:32px;height:32px;border-radius:8px;background:transparent;color:var(--mt);border:1px solid var(--bd);cursor:pointer;font-size:14px;margin-bottom:4px}
.mic.rec{background:var(--dn);color:#fff;animation:micPulse 1s infinite}@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:all .3s cubic-bezier(.4,0,.2,1)}.cd:hover{transform:translateY(-2px);border-color:var(--p1);box-shadow:0 8px 25px rgba(139,92,246,.15)}
.cd h3{font-size:13px;font-weight:800;margin-bottom:2px}
.cd p{font-size:11px;color:var(--mt)}
.bt{padding:7px 12px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:800;font-size:11px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}.bt:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(139,92,246,.5)}.bt:active{transform:scale(.96)}
.bt.dn{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.bt.ok{background:linear-gradient(135deg,#10b981,#059669)}
.bt.sc{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;position:relative}
.sc:hover{border-color:var(--p1);transform:translateY(-4px) scale(1.03);box-shadow:0 10px 30px rgba(139,92,246,.3)}.sc:hover .ico{animation:iconBounce .5s ease}@keyframes iconBounce{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.2) rotate(-5deg)}75%{transform:scale(1.2) rotate(5deg)}}
.sc .ico{font-size:30px;margin-bottom:4px}
.sc h4{font-size:12px;font-weight:800;margin-bottom:4px}
.sc .pr{font-size:14px;font-weight:900;color:var(--wn);margin:6px 0;font-family:monospace}
.sc .bd{position:absolute;top:6px;left:6px;background:var(--dn);color:#fff;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:900}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tb2{padding:7px 14px;border-radius:8px;background:var(--cd);border:1px solid var(--bd);color:var(--mt);font-weight:800;font-size:11px;cursor:pointer}
.tb2.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:none}
.sr{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sr span{font-size:12px;font-weight:700}
.sw{position:relative;width:36px;height:20px;flex-shrink:0}
.sw input{display:none}
.sw label{position:absolute;inset:0;background:var(--bd);border-radius:20px;cursor:pointer;transition:.2s}
.sw label::before{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+label{background:var(--p1)}
.sw input:checked+label::before{transform:translateX(16px)}
.in{width:100%;padding:10px 14px;border-radius:10px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);outline:none;font-size:13px;direction:ltr;text-align:left}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:none}
.ov.on{display:block}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.tt{background:var(--pn);border:1px solid var(--p1);padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;animation:ttIn .3s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.5)}@keyframes ttIn{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.tt.ok{border-color:var(--ok)}
.tt.er{border-color:var(--dn)}
.wcv{display:block;margin:16px auto;border-radius:50%;box-shadow:0 0 30px rgba(139,92,246,.4);transition:transform 4s cubic-bezier(.17,.67,.1,1)}
#vm{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#vm.on{display:flex}
.vw2{display:flex;gap:6px;align-items:center;height:60px;margin:20px 0}
.vw2 span{width:6px;background:var(--p1);border-radius:10px;animation:vw 1s infinite alternate}
.vw2 span:nth-child(2){animation-delay:.15s}
.vw2 span:nth-child(3){animation-delay:.3s}
.vw2 span:nth-child(4){animation-delay:.45s}
.vw2 span:nth-child(5){animation-delay:.6s}
@keyframes vw{0%{height:15px}100%{height:60px}}
</style>

function playTTS(el, text) {
    if (!('speechSynthesis' in window)) {
        tst('متصفحك مش بيدعم الصوت', 'er');
        return;
    }
    if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        el.innerHTML = '<i class="ph ph-speaker-high"></i> استماع';
        return;
    }
    const clean = text.replace(/[*_`#>\-]/g, '').replace(/```[\s\S]*?```/g, '').slice(0, 500);
    if (!clean.trim()) return;
    const utt = new SpeechSynthesisUtterance(clean);
    utt.lang = 'ar-SA';
    utt.rate = 0.95;
    utt.pitch = 1;
    const voices = speechSynthesis.getVoices();
    const arVoice = voices.find(v => v.lang.startsWith('ar'));
    if (arVoice) utt.voice = arVoice;
    utt.onstart = () => { el.innerHTML = '<i class="ph ph-stop-circle" style="color:var(--dn)"></i> إيقاف'; };
    utt.onend = () => { el.innerHTML = '<i class="ph ph-speaker-high"></i> استماع'; };
    utt.onerror = () => { el.innerHTML = '<i class="ph ph-speaker-high"></i> استماع'; tst('الصوت مش متاح', 'er'); };
    speechSynthesis.speak(utt);
}

function exportChat() {
  const msgs = document.getElementById('msgs');
  if (!msgs) return;
  const data = {
    exported_at: new Date().toISOString(),
    total_messages: msgs.children.length,
    content: msgs.innerText
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spider_chat_' + Date.now() + '.json';
  a.click();
  tst('✅ تم تصدير الشات', 'ok');
}

            // رابط الصورة
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(englishPrompt)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;

    try {
        const r = await fetch('/api/web_chat', {
            method: 'POST', 
            headers: {...H, 'Content-Type':'application/json'},

let _vaultSearchTimeout;
function setVaultFilter(f) {
    window._vaultFilter = f;
    ['all', 'with_username', 'without_username'].forEach(x => {
        let btn = document.getElementById('v-filt-' + x);
        if(btn) {
            btn.style.background = (x === f) ? 'var(--p1)' : 'var(--cd)';
            btn.style.color = (x === f) ? '#fff' : 'var(--tx)';
        }
    });
    loadVault(1);
}

async function loadVault(page = 1) {
    window._vaultPage = page;
    const search = document.getElementById('vault-search') ? document.getElementById('vault-search').value : '';
    const filter = window._vaultFilter || 'all';
    const limit = 20;
    
    const el = document.getElementById('vl');
    if(page === 1) el.innerHTML = '<div class="cd">جاري التحميل...</div>';
    
    try {
        const r = await fetch(`/api/web/vault/list?page=${page}&limit=${limit}&search=${encodeURIComponent(search)}&filter=${filter}`, {headers: H});
        const d = await r.json();
        
        if(!d.members || d.members.length === 0) {
            el.innerHTML = '<div class="cd" style="text-align:center;color:var(--mt)">لا توجد نتائج</div>';
            document.getElementById('vault-pagination').innerHTML = '';
            return;
        }
        
        el.innerHTML = d.members.map(m => `
            <div class="cd" style="display:flex; justify-content:space-between; align-items:center">
                <div>
                    <h3 style="font-family:monospace;font-size:12px;color:#fff">${m.user_id || m.id}</h3>
                    <p style="font-size:11px;color:var(--p2)">${m.username ? '@' + m.username : '<span style="color:var(--mt)">بدون يوزر</span>'}</p>
                </div>
            </div>
        `).join('');
        
        // الترقيم
        const totalPages = Math.ceil(d.total / limit);
        let pag = '';
        if(totalPages > 1) {
            pag += `<button class="bt sc" onclick="loadVault(${page-1})" ${page === 1 ? 'disabled style="opacity:0.5"' : ''} style="padding:5px 10px"><i class="ph ph-caret-right"></i> السابق</button>`;
            pag += `<span style="font-size:12px;font-weight:800;color:var(--mt)">صفحة ${page} من ${totalPages}</span>`;
            pag += `<button class="bt sc" onclick="loadVault(${page+1})" ${page === totalPages ? 'disabled style="opacity:0.5"' : ''} style="padding:5px 10px">التالي <i class="ph ph-caret-left"></i></button>`;
        }
        document.getElementById('vault-pagination').innerHTML = pag;
        
    } catch(e) {
        el.innerHTML = 'فشل التحميل';
    }
}

let cmdSel = 0;
function openCmd() {
  document.getElementById('cmd-palette').classList.add('on');
  document.getElementById('cmd-inp').value = '';
  document.getElementById('cmd-inp').focus();
  filterCmd();
}
function closeCmd() { document.getElementById('cmd-palette').classList.remove('on'); }
function filterCmd() {
  const q = document.getElementById('cmd-inp').value.toLowerCase();
  const filtered = CMD_ITEMS.filter(i => i.t.toLowerCase().includes(q));
  cmdSel = 0;
  document.getElementById('cmd-list').innerHTML = filtered.map((i,idx) =>
    `<div class="cmd-item ${idx===0?'sel':''}" onclick="go('${i.go}');closeCmd()"><i class="ph ${i.ic}"></i>${i.t}</div>`
  ).join('') || '<div style="padding:20px;text-align:center;color:var(--mt)">مفيش نتائج</div>';
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCmd(); }
  if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); openCmd(); }
  if (e.key === 'Escape') closeCmd();
  if (document.getElementById('cmd-palette').classList.contains('on')) {
    const items = document.querySelectorAll('.cmd-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = Math.min(cmdSel+1, items.length-1); items.forEach((it,i)=>it.classList.toggle('sel', i===cmdSel)); }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = Math.max(cmdSel-1, 0); items.forEach((it,i)=>it.classList.toggle('sel', i===cmdSel)); }
    if (e.key === 'Enter' && items[cmdSel]) items[cmdSel].click();
  }
});

  t.style.overflow='hidden';

<script>
(function(){
    'use strict';
    if (window._ultimateFabLoaded) return;
    window._ultimateFabLoaded = true;

    // ═══ 1. إنشاء الزر العائم ═══
    let fab = document.getElementById('_sess_fab');
    if (!fab) {
        fab = document.createElement('button');
        fab.id = '_sess_fab';
        fab.innerHTML = '📱';
        fab.style.cssText = 'position:fixed;bottom:20px;left:20px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:999999;touch-action:none;box-shadow:0 8px 24px rgba(139,92,246,.6);user-select:none;';
        document.body.appendChild(fab);
    }

    let isDragging = false, startX, startY, initialX, initialY;

    fab.addEventListener('pointerdown', (e) => {
        isDragging = false;
        fab.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
        const rect = fab.getBoundingClientRect();
        initialX = rect.left;
        initialY = rect.top;
    });

    fab.addEventListener('pointermove', (e) => {
        if (e.buttons !== 1 && e.pointerType === 'mouse') return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            isDragging = true;
            fab.style.left = (initialX + dx) + 'px';
            fab.style.top = (initialY + dy) + 'px';
            fab.style.bottom = 'auto';
        }
    });

    fab.addEventListener('pointerup', (e) => {
        fab.releasePointerCapture(e.pointerId);

<script id="_wheel_fix_final">
(function() {
    let _currentRot = 0;
    
    // دالة عرض العجلة
    window.r_wheel = function() {
        document.getElementById('pg-wheel').innerHTML = `
        <div class="pt"><i class="ph ph-circle-notch" style="color:var(--dn)"></i> العجلة</div>
        <div style="text-align:center; position: relative;">
            <div style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid var(--dn); z-index: 10;"></div>
            <canvas id="wcv" class="wcv" width="260" height="260" style="margin-top: 20px; transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 1);"></canvas>
            <button class="bt" id="wbt" onclick="window.sw()" style="padding:12px 40px;font-size:14px">🎡 لف</button>
            <div id="wr" style="margin-top:10px;font-size:14px;font-weight:900;min-height:20px"></div>
        </div>`;
        window.dw();
    };

    // دالة رسم العجلة (8 أقسام)
    window.dw = function() {
        const c = document.getElementById('wcv');
        if (!c) return;
        const x = c.getContext('2d');
        
        // الأرقام دي هي اللي في السيرفر بالظبط (tasks.py)
        const P = [
            {l:'0', c:'#334155'}, {l:'5', c:'#ef4444'},
            {l:'0', c:'#334155'}, {l:'10', c:'#3b82f6'},
            {l:'20', c:'#8b5cf6'}, {l:'50', c:'#10b981'},
            {l:'100', c:'#f59e0b'}, {l:'500', c:'#ec4899'}
        ];
        const N = P.length, A = 2 * Math.PI / N;
        x.clearRect(0, 0, 260, 260);
        
        for (let i = 0; i < N; i++) {
            x.beginPath(); x.moveTo(130, 130);
            x.arc(130, 130, 128, i * A, (i + 1) * A);
            x.fillStyle = P[i].c; x.fill();
            x.strokeStyle = '#000'; x.lineWidth = 3; x.stroke();
            
            x.save(); x.translate(130, 130); x.rotate(i * A + A / 2);
            x.textAlign = 'right'; x.fillStyle = '#fff'; x.font = 'bold 20px Cairo';
            x.fillText(P[i].l, 110, 7); x.restore();
        }
        x.beginPath(); x.arc(130, 130, 18, 0, 7);
        x.fillStyle = '#8b5cf6'; x.fill();
    };

    // دالة اللف
    window.sw = async function() {
        const b = document.getElementById('wbt');
        if (b.disabled) return;
        b.disabled = true; b.textContent = '⏳ جاري اللف...';
        
        try {
            const r = await fetch('/api/web/wheel/spin', {method:'POST', headers: H});
            const d = await r.json();
            
            if (d.error) { 
                tst(d.error, 'er'); 
                b.disabled = false; b.textContent = '🎡 لف'; 
                return; 
            }

            const idx = d.idx; // السيرفر بيرجع رقم القسم اللي كسبت فيه (من 0 لـ 7)
            const target = 270 - (idx * 45 + 22.5); // حساب الزاوية عشان السهم يقف عليها بالظبط
            const normTarget = ((target % 360) + 360) % 360;
            const currentNorm = _currentRot % 360;
            
            // بنضيف 5 لفات كاملة + الزاوية المطلوبة
            let rotationToAdd = 360 * 5 + normTarget - currentNorm;
            if (rotationToAdd < 360 * 5) rotationToAdd += 360;
            
            _currentRot += rotationToAdd;

            const canvas = document.getElementById('wcv');
            canvas.style.transform = `rotate(${_currentRot}deg)`;

            setTimeout(() => {
                b.disabled = false; b.textContent = '🎡 لف';
                const wr = document.getElementById('wr');
                if (wr) {
                    wr.textContent = '🎉 مبروك ربحت ' + d.won + ' نقطة!';
                    wr.style.color = 'var(--ok)';
                }
                const tp = document.getElementById('tp');
                if (tp) {
                    const c = parseInt(tp.textContent) || 0;
                    tp.textContent = (c + d.won) + ' 🪙';
                }
            }, 4100);
            
        } catch(e) {
            b.disabled = false; b.textContent = '🎡 لف';
            tst('فشل الاتصال', 'er');
        }
    };
})();
</script>

async function doTransfer() {
    const targetId = document.getElementById('tr_target').value.trim();
    const amountStr = document.getElementById('tr_amount').value.trim();
    const msgBox = document.getElementById('tr_msg');
    
    if(!targetId || !amountStr) {
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(239,68,68,0.1)';
        msgBox.style.color = 'var(--dn)';
        msgBox.textContent = '❌ الرجاء إدخال البيانات كاملة';
        return;
    }
    
    const amount = parseInt(amountStr);
    if(isNaN(amount) || amount <= 0) {
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(239,68,68,0.1)';
        msgBox.style.color = 'var(--dn)';
        msgBox.textContent = '❌ الرجاء إدخال رقم صحيح';
        return;
    }
    
    msgBox.style.display = 'block';
    msgBox.style.background = 'rgba(255,255,255,0.05)';
    msgBox.style.color = 'var(--mt)';
    msgBox.textContent = '⏳ جاري التحويل...';

        const r = await fetch('/api/web/transfer', {
            method: 'POST',
            headers: {...H, 'Content-Type':'application/json'},
            body: JSON.stringify({target_id: targetId, amount: amount})
        });
        const d = await r.json();
        
        if(d.error) {
            msgBox.style.background = 'rgba(239,68,68,0.1)';
            msgBox.style.color = 'var(--dn)';

        msgBox.style.color = 'var(--ok)';

        // تحديث الرصيد

<script>
async function scheduleTask() {
    const timeStr = prompt("اكتب وقت البدء (مثال: 14:30) بصيغة 24 ساعة:");
    if(!timeStr) return;
    
    if(!/^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(timeStr)) {
        alert('صيغة الوقت غلط. استخدم HH:MM');
        return;
    }

    const type = window._rs_title.textContent.includes('السحب') ? 'scrape' : 'pump';
    const chatId = window._currentChatId; // هنحتاج نحفظه
    const mode = type === 'scrape' ? (window.selectedModes?.s || 'بيوزر') : (window.selectedModes?.p || 'آمن');
    let filterType = 'all';
    if(type === 'scrape') {
        if(mode === 'بيوزر') filterType = 'usernames_only';
        else if(mode === 'بصورة') filterType = 'with_photo';
    }

    try {
        const r = await fetch('/api/web/schedule', {
            method: 'POST',
            headers: {...H, 'Content-Type':'application/json'},
            body: JSON.stringify({
                type: type,
                chat_id: chatId,
                mode: mode,
                filter: filterType,
                run_at: timeStr
            })
        });
        const d = await r.json();
        if(d.error) alert('❌ ' + d.error);
        else {
            alert('✅ تم جدولة العملية الساعة ' + timeStr);
            document.getElementById('_rs_modal').remove();
        }
    } catch(e) { alert('فشل الاتصال'); }
}
</script>

            +       '</div>'

            +   '</div>'

            +     '<button id="_rs_stop" style="flex:1;padding:12px;background:rgba(239,68,68,.15);color:#ef4444;border:1px solid #ef4444;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer;font-family:Cairo,sans-serif">إيقاف</button>'

        document.body.appendChild(m);

    // ═══ 2. بدء العملية ═══
    window.startTask = async function(type, chatId, chatTitle) {
        window._currentChatId = chatId; // حفظ الـ ID للجدولة
        createModal();

        document.getElementById('_rs_title').textContent = (type === 'scrape' ? '🕷️ جاري السحب' : '🚀 جاري الضخ');
        document.getElementById('_rs_subtitle').textContent = chatTitle || ('chat: ' + chatId);

        try {
            var ep = type === 'scrape' ? '/api/web/scrape/start' : '/api/web/pump/start';
            var selectedMode = type === 'scrape' 
                ? (window.selectedModes && window.selectedModes.s ? window.selectedModes.s : 'بيوزر') 
                : (window.selectedModes && window.selectedModes.p ? window.selectedModes.p : 'آمن');
                
            var payload = { chat_id: chatId };
            if (type === 'scrape') {
                if (selectedMode === 'بيوزر') payload.filter = 'usernames_only';
                else if (selectedMode === 'بصورة') payload.filter = 'with_photo';
                else payload.filter = 'all';
                payload.mode = selectedMode;
            } else {
                payload.mode = selectedMode;
            }

            var r = await fetch(ep, {
                method: 'POST',
                headers: {'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
                body: JSON.stringify(payload)
            });
            var d = await r.json();

            if (d.error) {
                document.getElementById('_rs_status').textContent = '❌ ' + d.error;
                document.getElementById('_rs_status').style.color = '#ef4444';
                return;
            }

            document.getElementById('_rs_status').textContent = '✅ بدأت العملية (' + selectedMode + ')';
            document.getElementById('_rs_status').style.color = '#10b981';

            pollStatus(d.task_id, type);
        } catch(e) {
            document.getElementById('_rs_status').textContent = '❌ ' + e.message;
            document.getElementById('_rs_status').style.color = '#ef4444';
        }
    };

    // ═══ 3. متابعة التقدم ═══
    function pollStatus(taskId, type) {
        if (activePolls[taskId]) clearInterval(activePolls[taskId]);
        var stopBtn = document.getElementById('_rs_stop');
        if (stopBtn) {
            stopBtn.onclick = async function() {
                try {
                    await fetch('/api/web/scrape/cancel/' + taskId, {method:'POST', headers:{'ngrok-skip-browser-warning':'true'}});
                    stopBtn.textContent = 'جاري الإيقاف...';
                } catch(e) {}
            };
        }

        activePolls[taskId] = setInterval(async function() {
            try {
                var url = type === 'scrape' ? '/api/web/scrape/status/' + taskId : '/api/web/pump/status/' + taskId;
                var r = await fetch(url, {headers:{'ngrok-skip-browser-warning':'true'}});
                var d = await r.json();
                if (d.error) { clearInterval(activePolls[taskId]); return; }

                var sc = d.scraped || 0, fl = d.failed || 0, tn = d.scanned || 0;
                var e1 = document.getElementById('_rs_scraped'); if (e1) e1.textContent = sc;
                var e2 = document.getElementById('_rs_failed'); if (e2) e2.textContent = fl;
                var e3 = document.getElementById('_rs_scanned'); if (e3) e3.textContent = tn;

                var pct = 0;
                if (d.status === 'completed') pct = 100;
                else if (tn > 0) pct = Math.min(95, Math.floor((sc / tn) * 100));
                var epct = document.getElementById('_rs_pct'); if (epct) epct.textContent = pct + '%';
                var ebar = document.getElementById('_rs_bar'); if (ebar) ebar.style.width = pct + '%';

                var st = '🔄 جاري...';
                if (d.status === 'completed') st = d.reason || '✅ اكتمل!';
                else if (d.status === 'cancelled') st = '⚠️ أُلغي';
                else if (d.status === 'failed') st = d.reason || '❌ فشل';
                else if (d.status === 'empty') st = '📭 ' + (d.reason || 'لا نتائج');
                else if (d.reason) st = d.reason;
                var est = document.getElementById('_rs_status');
                if (est) est.textContent = st;

                if (type === 'pump' && d.session_limit) {
                    var sl = d.session_limit;
                    var wrap = document.getElementById('_rs_sess_bar_wrap');
                    if (wrap) wrap.style.display = 'block';
                    var pct = Math.min(100, Math.floor((sl.used / sl.max) * 100));
                    var ep = document.getElementById('_rs_sess_pct'); if(ep) ep.textContent = pct + '%';
                    var eb = document.getElementById('_rs_sess_bar'); if(eb) eb.style.width = pct + '%';
                    var es = document.getElementById('_rs_sess_status'); if(es) es.textContent = 'الجلسة: ' + sl.used + '/' + sl.max;
                }

                if (d.members_preview) {
                    try {
                        var members = typeof d.members_preview === 'string' ? JSON.parse(d.members_preview) : d.members_preview;
                        var membersEl = document.getElementById('_rs_members');
                        if (membersEl && members && members.length > 0) {
                            membersEl.innerHTML = members.map(function(m, i) {
                                var un = m.username ? '@' + m.username : (m.id || '?');
                                return '<div style="display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px">'
                                    + '<span style="color:#fff;font-weight:700">' + (i+1) + '. ' + (m.name || un) + '</span>'
                                    + '<span style="color:#8b5cf6;font-family:monospace;font-size:10px">' + un + '</span>'
                                    + '</div>';
                            }).join('');
                        }
                    } catch(e) {}
                }

                if (['completed','cancelled','failed','empty'].includes(d.status)) {
                    clearInterval(activePolls[taskId]);
                    delete activePolls[taskId];
                }
            } catch(e) {}
        }, 2000);
    }

    // ═══ 4. دالة الجدولة ═══
    window.scheduleTask = function() {
        document.getElementById('_schedule_modal').style.display = 'flex';
        document.getElementById('_sched_time_input').value = '';
    };

    window.confirmSchedule = async function() {
        const timeStr = document.getElementById('_sched_time_input').value;
        if(!timeStr) {
            alert('من فضلك اختر الوقت');
            return;
        }

        const type = document.getElementById('_rs_title').textContent.includes('السحب') ? 'scrape' : 'pump';
        const chatId = window._currentChatId;
        const mode = type === 'scrape' ? (window.selectedModes?.s || 'بيوزر') : (window.selectedModes?.p || 'آمن');
        let filterType = 'all';
        if(type === 'scrape') {
            if(mode === 'بيوزر') filterType = 'usernames_only';
            else if(mode === 'بصورة') filterType = 'with_photo';
        }

        const btn = document.querySelector('#_schedule_modal button:last-child');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="ph ph-spinner-gap" style="animation:spin 1s linear infinite"></i> جاري الجدولة...';
        btn.disabled = true;

        try {
            const r = await fetch('/api/web/schedule', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({
                    type: type, chat_id: chatId, mode: mode, filter: filterType, run_at: timeStr
                })
            });
            const d = await r.json();
            if(d.error) {
                alert('❌ ' + d.error);
            } else {
                if(typeof fireConfetti === 'function') fireConfetti();
                alert('✅ تم جدولة العملية الساعة ' + timeStr);
                document.getElementById('_schedule_modal').style.display = 'none';
                document.getElementById('_rs_modal').remove();
            }
        } catch(e) { 
            alert('فشل الاتصال'); 
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    };

    // ═══ 5. أزرار الجروبات ═══
    window.startScrapeGroup = function(chatId, title) { window.startTask('scrape', chatId, title); };
    window.startPumpGroup = function(chatId, title) { window.startTask('pump', chatId, title); };

    // تعديل دالة تحميل الجروبات عشان تبني أزرار شغالة
    var originalLg = window.lg;
    window.lg = async function(t) {
        const el = document.getElementById('gr-' + t);
        if (!el) return;
        el.innerHTML = 'جاري التحميل...';
        try {
            var H = {'ngrok-skip-browser-warning':'true'};
            const r = await fetch('/api/web/scrape/groups', {headers: H});
            const d = await r.json();
            if (d.error || !d.groups) {
                el.innerHTML = '<div style="color:#ef4444;font-size:11px">' + (d.error || 'لا جروبات') + '</div>';
                return;
            }
            el.innerHTML = d.groups.map(function(g) {
                var safeTitle = (g.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                var action = t === 'pump' ? 'startPumpGroup' : 'startScrapeGroup';
                return '<div class="cd" style="margin-top:6px">'
                    + '<div><h3>' + (g.title || 'بدون اسم') + '</h3><p>' + (g.members || 0) + ' عضو</p></div>'
                    + '<button class="bt" onclick="' + action + '(' + g.id + ', \'' + safeTitle + '\')">' + (t === 'pump' ? 'ضخ' : 'سحب') + '</button>'
                    + '</div>';
            }).join('');
        } catch(e) {
            el.innerHTML = 'فشل';
        }
    };

})();
</script>

<script id="_schedule_logic">
// الدالة اللي بتفتح الشاشة
window.scheduleTask = function() {
    document.getElementById('_schedule_modal').style.display = 'flex';
    document.getElementById('_sched_time_input').value = '';
};

// الدالة اللي بتبعت الطلب للسيرفر
window.confirmSchedule = async function() {
    const timeStr = document.getElementById('_sched_time_input').value;
    if(!timeStr) {
        alert('من فضلك اختر الوقت');
        return;
    }

    const type = document.getElementById('_rs_title').textContent.includes('السحب') ? 'scrape' : 'pump';
    const chatId = window._currentChatId;
    const mode = type === 'scrape' ? (window.selectedModes?.s || 'بيوزر') : (window.selectedModes?.p || 'آمن');
    let filterType = 'all';
    if(type === 'scrape') {
        if(mode === 'بيوزر') filterType = 'usernames_only';
        else if(mode === 'بصورة') filterType = 'with_photo';
    }

    const btn = document.querySelector('#_schedule_modal button:last-child');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'جاري الجدولة...';
    btn.disabled = true;

    try {
        const r = await fetch('/api/web/schedule', {
            method: 'POST',
            headers: {'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
            body: JSON.stringify({
                type: type, chat_id: chatId, mode: mode, filter: filterType, run_at: timeStr
            })
        });
        const d = await r.json();
        if(d.error) {
            alert('❌ ' + d.error);
        } else {
            if(typeof fireConfetti === 'function') fireConfetti();
            alert('✅ تم جدولة العملية الساعة ' + timeStr);
            document.getElementById('_schedule_modal').style.display = 'none';
            document.getElementById('_rs_modal').remove();
        }
    } catch(e) { 
        alert('فشل الاتصال'); 
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
};
</script>

window.copyRefLink = function() {

        if(typeof tst === 'function') tst('✅ تم نسخ رابط الإحالة', 'ok');
        if(typeof fireConfetti === 'function') fireConfetti();
    }).catch(() => {

};
</script>


<script id="proxies_injection">
// ═══════════════════════════════════════════════════════
// تحديث صفحة البروكسيات (UI جديد بالكامل)
// ═══════════════════════════════════════════════════════
window.r_proxies = async function() {
    const el = document.getElementById('pg-proxies');
    if(!el) return;
    
    el.innerHTML = `
    <div class="pt" style="display:flex; justify-content:space-between; align-items:center">
        <div><i class="ph ph-globe" style="color:var(--p1)"></i> البروكسيات</div>
        <button class="bt" onclick="fetchNewProxies(this)" style="padding:8px 15px; font-size:12px; display:flex; align-items:center; gap:5px">
            <i class="ph ph-download-simple"></i> جلب بروكسيات
        </button>
    </div>
    
    <div id="proxy-stats-container" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px">
        <div class="cd" style="text-align:center"><div id="stat-total" style="font-size:20px; font-weight:900; color:var(--tx)">-</div><div style="font-size:10px; color:var(--mt)">الإجمالي</div></div>
        <div class="cd" style="text-align:center; border-color:var(--ok)"><div id="stat-valid" style="font-size:20px; font-weight:900; color:var(--ok)">-</div><div style="font-size:10px; color:var(--mt)">شغال</div></div>
        <div class="cd" style="text-align:center; border-color:var(--dn)"><div id="stat-dead" style="font-size:20px; font-weight:900; color:var(--dn)">-</div><div style="font-size:10px; color:var(--mt)">ميت</div></div>
    </div>
    
    <div id="proxy-list-container" style="display:flex; flex-direction:column; gap:8px">
        <div class="cd" style="text-align:center; padding:20px; color:var(--mt)">جاري تحميل البروكسيات...</div>
    </div>
    `;
    
    loadProxies();
};

window.loadProxies = async function() {
    try {
        // جلب الإحصائيات
        const sRes = await fetch('/api/web/proxies/stats', {headers: H});
        const sData = await sRes.json();
        if(document.getElementById('stat-total')) {
            document.getElementById('stat-total').textContent = sData.total || 0;
            document.getElementById('stat-valid').textContent = sData.valid || 0;
            document.getElementById('stat-dead').textContent = sData.dead || 0;
        }

        // جلب القائمة
        const lRes = await fetch('/api/web/proxies/list', {headers: H});
        const lData = await lRes.json();
        const listEl = document.getElementById('proxy-list-container');
        
        if(!lData.proxies || lData.proxies.length === 0) {
            listEl.innerHTML = '<div class="cd" style="text-align:center; color:var(--mt)">لا توجد بروكسيات. اضغط على "جلب بروكسيات".</div>';
            return;
        }
        
        listEl.innerHTML = lData.proxies.map(p => {
            const isAlive = p.status === 'VALID';
            const color = isAlive ? 'var(--ok)' : 'var(--dn)';
            const bg = isAlive ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)';
            return `
            <div class="cd" style="display:flex; justify-content:space-between; align-items:center; border-color:${color}; background:${bg}">
                <div style="font-family:monospace; font-size:13px; color:#fff; font-weight:700">${p.proxy_string}</div>
                <div style="font-size:10px; font-weight:900; color:${color}; text-transform:uppercase">${p.status}</div>
            </div>`;
        }).join('');
        
    } catch(e) {
        if(document.getElementById('proxy-list-container'))
            document.getElementById('proxy-list-container').innerHTML = '<div class="cd" style="text-align:center; color:var(--dn)">فشل تحميل البيانات</div>';
    }
};

window.fetchNewProxies = async function(btn) {
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="ph ph-spinner-gap" style="animation:spin 1s linear infinite"></i> جاري الجلب...';
    
    try {
        const r = await fetch('/api/web/proxies/fetch', {method: 'POST', headers: H});
        const d = await r.json();
        
        if(d.error) {
            if(typeof tst === 'function') tst(d.error, 'er');
        } else {
            if(typeof tst === 'function') tst('✅ تم جلب ' + (d.count || 0) + ' بروكسي', 'ok');
            if(typeof fireConfetti === 'function') fireConfetti();
            loadProxies(); // إعادة تحديث القائمة
        }
    } catch(e) {
        if(typeof tst === 'function') tst('فشل الاتصال', 'er');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
};
</script>





<script id="support_injection">
// ═══════════════════════════════════════════════════════
// 1. إضافة الصفحة (View) لو مش موجودة
// ═══════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", function() {
    if(!document.getElementById('v-support')) {

        div.className = 'vw';
        div.id = 'v-support';
        div.innerHTML = '<div class="pi" id="pg-support"></div>';
        let mainContainer = document.querySelector('.mn');
        if(mainContainer) mainContainer.appendChild(div);
    }

    // ═══════════════════════════════════════════════════════
    // 2. مراقبة القائمة الجانبية وحقن الزر (بأمان تام)
    // ═══════════════════════════════════════════════════════
    setInterval(function() {
        let navElement = document.getElementById('nav');
        // لو القائمة رُسمت والزر لسه مش موجود
        if (navElement && !document.getElementById('nv-support')) {
            // بندور على قسم "الحساب" عشان نحط الزرار تحته
            let groups = navElement.querySelectorAll('.grp');
            let accountGroup = Array.from(groups).find(g => g.textContent.trim() === 'الحساب');

            let newBtn = document.createElement('div');
            newBtn.className = 'nv';
            newBtn.id = 'nv-support';
            newBtn.onclick = function() { g('support'); };
            newBtn.innerHTML = '<i class="ph ph-headset"></i> الدعم الفني';

            if (accountGroup) {
                accountGroup.insertAdjacentElement('afterend', newBtn);
            } else {
                navElement.appendChild(newBtn);
            }
        }
    }, 1000); // بيفحص كل ثانية
});

// ═══════════════════════════════════════════════════════
// 3. تصميم وتفعيل صفحة الدعم الفني (الوظائف)
// ═══════════════════════════════════════════════════════
window.r_support = async function() {
    const el = document.getElementById('pg-support');
    if(!el) return;
    
    el.innerHTML = `
    <div class="pt"><i class="ph ph-headset" style="color:var(--p1)"></i> الدعم الفني</div>
    
    <div class="cd" style="margin-bottom:20px; background:linear-gradient(135deg, rgba(139,92,246,0.1), transparent); border-color:var(--p1)">
        <h3 style="font-size:14px; color:#fff; margin-bottom:10px;">📝 إرسال تذكرة جديدة</h3>
        <textarea id="support-msg" rows="3" placeholder="اكتب مشكلتك أو استفسارك هنا..." style="width:100%; background:rgba(0,0,0,0.5); border:1px solid var(--bd); border-radius:10px; padding:10px; color:#fff; font-family:Cairo,sans-serif; font-size:13px; resize:none; outline:none; margin-bottom:10px;" onfocus="this.style.borderColor='var(--p1)'" onblur="this.style.borderColor='var(--bd)'"></textarea>
        <button class="bt" onclick="sendTicket(this)" style="width:100%; padding:10px; border-radius:10px; font-weight:900;">إرسال التذكرة</button>
    </div>
    
    <div class="pt" style="margin-top:20px; font-size:14px"><i class="ph ph-clock-counter-clockwise"></i> تذاكري السابقة</div>
    <div id="tickets-list" style="display:flex; flex-direction:column; gap:10px">
        <div class="cd" style="text-align:center; color:var(--mt)">جاري التحميل...</div>
    </div>
    `;
    
    loadTickets();
};

window.loadTickets = async function() {
    try {
        const r = await fetch('/api/web/support/list', {headers: H});
        const d = await r.json();
        const list = document.getElementById('tickets-list');
        
        if(!d.tickets || d.tickets.length === 0) {
            list.innerHTML = '<div class="cd" style="text-align:center; color:var(--mt)">لا توجد تذاكر سابقة.</div>';
            return;
        }
        
        list.innerHTML = d.tickets.map(t => {
            const isOpen = t.status === 'OPEN';
            const statusBadge = isOpen ? '<span style="background:var(--wn); color:#000; padding:2px 8px; border-radius:10px; font-size:9px; font-weight:900">قيد الانتظار</span>' : '<span style="background:var(--ok); color:#fff; padding:2px 8px; border-radius:10px; font-size:9px; font-weight:900">تم الرد</span>';
            const replyBox = t.admin_reply ? `<div style="margin-top:10px; padding:10px; background:rgba(16,185,129,0.1); border-right:3px solid var(--ok); border-radius:5px; font-size:12px; color:var(--tx)"><b>رد الإدارة:</b><br>${t.admin_reply}</div>` : '';
            
            return `
            <div class="cd" style="flex-direction:column; align-items:stretch; border-color:${isOpen ? 'var(--wn)' : 'var(--ok)'}">
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <div style="font-size:10px; color:var(--mt)">${t.created_at}</div>
                    ${statusBadge}
                </div>
                <div style="font-size:13px; color:#fff; line-height:1.5;">${t.message}</div>
                ${replyBox}
            </div>`;
        }).join('');
    } catch(e) {
        document.getElementById('tickets-list').innerHTML = '<div class="cd" style="text-align:center; color:var(--dn)">فشل تحميل التذاكر</div>';
    }
};

window.sendTicket = async function(btn) {
    const msg = document.getElementById('support-msg').value.trim();
    if(!msg) {
        if(typeof tst === 'function') tst('❌ اكتب رسالتك أولاً', 'er');
        return;
    }
    
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'جاري الإرسال...';
    
    try {
        const r = await fetch('/api/web/support/create', {
            method: 'POST',
            headers: {...H, 'Content-Type':'application/json'},
            body: JSON.stringify({message: msg})
        });
        const d = await r.json();
        
        if(d.error) {
            if(typeof tst === 'function') tst(d.error, 'er');
        } else {
            if(typeof tst === 'function') tst('✅ تم إرسال التذكرة بنجاح', 'ok');
            if(typeof fireConfetti === 'function') fireConfetti();
            document.getElementById('support-msg').value = '';
            loadTickets();
        }
    } catch(e) {
        if(typeof tst === 'function') tst('فشل الاتصال', 'er');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
};
</script>


<script id="activity_injection">

            let newBtn = document.createElement('div');
            newBtn.className = 'nv';

// ═══════════════════════════════════════════════════════
// 3. دالة عرض الصفحة والتحديث التلقائي
// ═══════════════════════════════════════════════════════
let _activityInterval = null;

window.r_activity = async function() {
    const el = document.getElementById('pg-activity');
    if(!el) return;
    
    el.innerHTML = `
    <div class="pt" style="display:flex; justify-content:space-between; align-items:center">
        <div><i class="ph ph-pulse" style="color:var(--ok)"></i> نبض المنصة <span style="font-size:10px; color:var(--ok); animation:pulse 2s infinite">● مباشر</span></div>
    </div>
    <div id="activity-list" style="display:flex; flex-direction:column; gap:10px">
        <div class="cd" style="text-align:center; color:var(--mt)">جاري التحميل...</div>
    </div>
    `;
    
    loadActivity();
    
    // تحديث تلقائي كل 10 ثواني
    if(_activityInterval) clearInterval(_activityInterval);
    _activityInterval = setInterval(loadActivity, 10000);
};

window.loadActivity = async function() {
    try {
        const r = await fetch('/api/web/activity_feed', {headers: H});
        const d = await r.json();
        const list = document.getElementById('activity-list');
        if(!list) return; // لو المستخدم خرج من الصفحة
        
        if(!d.activities || d.activities.length === 0) {
            list.innerHTML = '<div class="cd" style="text-align:center; color:var(--mt)">لا توجد نشاطات حديثة.</div>';
            return;
        }
        
        list.innerHTML = d.activities.map(a => {
            let icon = 'ph-info';
            let color = 'var(--p1)';
            
            // تخصيص الأيقونة واللون حسب الحركة
            if(a.action.includes('scrape') || a.action.includes('Scrape')) { icon = 'ph-spider'; color = 'var(--p1)'; }
            else if(a.action.includes('pump') || a.action.includes('Pump')) { icon = 'ph-rocket'; color = 'var(--p2)'; }
            else if(a.action.includes('VIP') || a.action.includes('vip')) { icon = 'ph-crown'; color = 'var(--wn)'; }
            else if(a.action.includes('Transfer')) { icon = 'ph-paper-plane-tilt'; color = 'var(--ok)'; }
            else if(a.action.includes('Badge')) { icon = 'ph-medal'; color = 'var(--wn)'; }
            else if(a.action.includes('Theme')) { icon = 'ph-palette'; color = 'var(--p2)'; }
            
            // تنسيق التاريخ ليكون مختصر
            let timeStr = a.created_at ? a.created_at.split(' ')[1] : '';
            if(a.created_at && a.created_at.includes(' ')) {
                 let parts = a.created_at.split(' ');
                 timeStr = parts[1].substring(0, 5); // HH:MM
            }
            
            return `
            <div class="cd" style="display:flex; gap:12px; align-items:center; border-right:3px solid ${color}; padding:12px">
                <div style="width:36px; height:36px; border-radius:50%; background:${color}20; color:${color}; display:flex; align-items:center; justify-content:center; font-size:18px">
                    <i class="ph ${icon}"></i>
                </div>
                <div style="flex:1">
                    <div style="font-size:13px; color:var(--tx); font-weight:700">${a.action}</div>
                    <div style="font-size:11px; color:var(--mt); margin-top:2px">${a.details || ''}</div>
                </div>
                <div style="font-size:10px; color:var(--mt); font-family:monospace">${timeStr}</div>
            </div>`;
        }).join('');
    } catch(e) {}
};
</script>

<script id="notifications_logic">
document.addEventListener("DOMContentLoaded", function() {
    // 1. تحديث حالة الجرس كل 30 ثانية
    function checkNotifications() {
        fetch('/api/web/notifications/list', {headers: H})
            .then(r => r.json())
            .then(d => {
                let dot = document.getElementById('notif_dot');
                if(!dot) {
                    // لو الجرس لسه مظهرش، نحاول نجيبه
                    let bell = document.querySelector('button[onclick="openNotifications()"]');
                    if(bell) { dot = document.createElement('span'); dot.id = 'notif_dot'; bell.appendChild(dot); }
                }
                if(dot) {
                    dot.style.display = (d.unread > 0) ? 'block' : 'none';
                    dot.style.position = 'absolute';
                    dot.style.top = '2px';
                    dot.style.right = '2px';
                    dot.style.width = '8px';
                    dot.style.height = '8px';
                    dot.style.background = '#ef4444';
                    dot.style.borderRadius = '50%';
                }
            }).catch(()=>{});
    }
    
    setTimeout(checkNotifications, 2000);
    setInterval(checkNotifications, 30000); // كل 30 ثانية

    // 2. شاشة الإشعارات المنبثقة
    window.openNotifications = async function() {
        let m = document.getElementById('_notif_modal');
        if(m) { m.remove(); return; }
        
        m = document.createElement('div');
        m.id = '_notif_modal';
        m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:80px 20px 20px;font-family:Cairo,sans-serif;direction:rtl';
        m.innerHTML = `
        <div style="background:linear-gradient(145deg,#0f1526,#1a1f3a);border:1px solid rgba(139,92,246,0.3);border-radius:20px;width:100%;max-width:450px;box-shadow:0 25px 50px rgba(0,0,0,0.8);max-height:80vh;display:flex;flex-direction:column;overflow:hidden">
            <div style="padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.2)">
                <h3 style="color:#fff;font-size:16px;font-weight:900;margin:0"><i class="ph ph-bell" style="color:var(--p1)"></i> الإشعارات</h3>
                <div style="display:flex;gap:8px">
                    <button onclick="markAllRead()" style="background:rgba(139,92,246,0.2);border:none;color:var(--p1);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif">قراءة الكل</button>
                    <button onclick="document.getElementById('_notif_modal').remove()" style="background:transparent;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1">×</button>
                </div>
            </div>
            <div id="notif_list" style="padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
                <div style="text-align:center;color:var(--mt);padding:20px">جاري التحميل...</div>
            </div>
        </div>`;
        document.body.appendChild(m);
        
        loadNotifications();
    };

    window.loadNotifications = async function() {
        try {
            const r = await fetch('/api/web/notifications/list', {headers: H});
            const d = await r.json();
            const list = document.getElementById('notif_list');
            if(!list) return;
            
            if(!d.notifications || d.notifications.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:var(--mt);padding:30px"><i class="ph ph-bell-slash" style="font-size:40px;margin-bottom:10px;opacity:0.5"></i><br>لا توجد إشعارات</div>';
                return;
            }
            
            list.innerHTML = d.notifications.map(n => {
                const isUnread = !n.is_read;
                const bg = isUnread ? 'rgba(139,92,246,0.1)' : 'transparent';
                const dot = isUnread ? '<span style="width:8px;height:8px;background:var(--p1);border-radius:50%;display:inline-block;margin-left:5px"></span>' : '';
                
                return `
                <div onclick="readNotification(${n.id})" style="background:${bg};border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;transition:0.2s" onmouseover="this.style.borderColor='var(--p1)'" onmouseout="this.style.borderColor='var(--bd)'">
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px">
                        <div style="font-weight:900;color:${isUnread ? '#fff' : 'var(--mt)'};font-size:13px">${n.title} ${dot}</div>
                        <div style="font-size:10px;color:var(--mt);font-family:monospace">${(n.created_at||'').split(' ')[1] || ''}</div>
                    </div>
                    <div style="font-size:12px;color:${isUnread ? 'var(--tx)' : 'var(--mt)'};line-height:1.5">${n.message}</div>
                </div>`;
            }).join('');
        } catch(e) {}
    };

    window.markAllRead = async function() {
        try {
            await fetch('/api/web/notifications/read', {method:'POST', headers:{...H,'Content-Type':'application/json'}, body:JSON.stringify({id: 'all'})});
            loadNotifications();
            let dot = document.getElementById('notif_dot');
            if(dot) dot.style.display = 'none';
            if(typeof tst === 'function') tst('✅ تم تحديد الكل كمقروء', 'ok');
        } catch(e) {}
    };

    window.readNotification = async function(id) {
        try {
            await fetch('/api/web/notifications/read', {method:'POST', headers:{...H,'Content-Type':'application/json'}, body:JSON.stringify({id: id})});
            loadNotifications();
        } catch(e) {}
    };
});
</script>


<script id="global_chat_logic">
document.addEventListener("DOMContentLoaded", function() {
    // 1. إنشاء الحاوية ديناميكياً
    setInterval(function() {
        let mn = document.querySelector('.mn');
        if (mn && !document.getElementById('v-global_chat')) {
            let div = document.createElement('div');
            div.className = 'vw';
            div.id = 'v-global_chat';
            div.innerHTML = '<div class="pi" id="pg-global_chat"></div>';
            mn.appendChild(div);
        }
    }, 500);

    // 2. حقن زر في القائمة
    setInterval(function() {
        let navElement = document.getElementById('nav');
        if (navElement && !document.getElementById('nv-global_chat')) {
            let groups = navElement.querySelectorAll('.grp');
            let basicsGroup = Array.from(groups).find(g => g.textContent.trim() === 'الأساسيات');
            
            let newBtn = document.createElement('div');
            newBtn.className = 'nv';
            newBtn.id = 'nv-global_chat';
            newBtn.onclick = function() { g('global_chat'); };
            newBtn.innerHTML = '<i class="ph ph-users-three"></i> الشات العام';

            if (basicsGroup) {
                basicsGroup.insertAdjacentElement('afterend', newBtn);
            } else {
                navElement.appendChild(newBtn);
            }
        }
    }, 1000);

    let _chatInterval = null;

    // 3. دالة عرض الصفحة
    window.r_global_chat = async function() {
        const el = document.getElementById('pg-global_chat');
        if(!el) return;
        
        el.innerHTML = `
        <div class="pt" style="display:flex; justify-content:space-between; align-items:center">
            <div><i class="ph ph-users-three" style="color:var(--p2)"></i> الشات العام <span style="font-size:10px; color:var(--ok); animation:pulse 2s infinite">● مباشر</span></div>
        </div>
        
        <div style="background:rgba(0,0,0,0.2); border:1px solid var(--bd); border-radius:16px; display:flex; flex-direction:column; height:65vh; overflow:hidden;">
            <!-- الرسائل -->
            <div id="chat-messages" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; scroll-behavior: smooth;">
                <div style="text-align:center; color:var(--mt); padding:20px;">جاري تحميل الدردشة...</div>
            </div>
            
            <!-- خانة الكتابة -->
            <div style="padding:10px; border-top:1px solid var(--bd); background:rgba(0,0,0,0.3); display:flex; gap:8px;">
                <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." maxlength="300" style="flex:1; background:var(--cd); border:1px solid var(--bd); padding:12px; border-radius:12px; color:#fff; font-family:Cairo,sans-serif; font-size:13px; outline:none;" onkeypress="if(event.key==='Enter') sendChatMessage()" onfocus="this.style.borderColor='var(--p2)'" onblur="this.style.borderColor='var(--bd)'">
                <button onclick="sendChatMessage()" style="background:linear-gradient(135deg, var(--p1), var(--p2)); color:#fff; border:none; padding:0 20px; border-radius:12px; font-size:18px; cursor:pointer; box-shadow:0 4px 10px rgba(59,130,246,0.3);"><i class="ph ph-paper-plane-right"></i></button>
            </div>
        </div>
        `;
        
        window.loadChatMessages(true);
        
        if(_chatInterval) clearInterval(_chatInterval);
        _chatInterval = setInterval(function() { window.loadChatMessages(false); }, 4000);
    };

    // 4. تحميل الرسائل
    window.loadChatMessages = async function(scrollToBottom) {
        try {
            const r = await fetch('/api/web/global_chat/messages', {headers: H});
            const d = await r.json();
            const box = document.getElementById('chat-messages');
            if(!box) { clearInterval(_chatInterval); return; }
            
            if(!d.messages || d.messages.length === 0) {
                box.innerHTML = '<div style="text-align:center; color:var(--mt); padding:20px;">لا توجد رسائل. كن أول من يتحدث!</div>';
                return;
            }
            
            const myId = S.u ? String(S.u.id) : '';
            
            box.innerHTML = d.messages.map(m => {
                const isMe = (String(m.user_id) === myId);
                const isOwner = (String(m.user_id) === '8813635835'); // ممكن تتغير حسب الـ config
                const bg = isMe ? 'linear-gradient(135deg, var(--p1), var(--p2))' : (isOwner ? 'linear-gradient(135deg, var(--wn), #d97706)' : 'var(--cd)');
                const align = isMe ? 'flex-end' : 'flex-start';
                const radius = isMe ? '15px 15px 0 15px' : '15px 15px 15px 0';
                const color = isMe || isOwner ? '#fff' : 'var(--tx)';
                const time = m.created_at ? m.created_at.split(' ')[1].substring(0,5) : '';
                
                return `
                <div style="display:flex; flex-direction:column; align-items:${align}; width:100%">
                    <div style="font-size:10px; color:var(--mt); margin-bottom:3px; margin-${isMe ? 'left' : 'right'}:5px">
                        ${isOwner ? '👑 المالك' : (isMe ? 'أنت' : 'ID: ' + m.user_id)} · ${time}
                    </div>
                    <div style="background:${bg}; color:${color}; padding:10px 14px; border-radius:${radius}; max-width:80%; font-size:13px; line-height:1.5; box-shadow:0 2px 5px rgba(0,0,0,0.2); word-break:break-word;">
                        ${escapeHtml(m.message)}
                    </div>
                </div>`;
            }).join('');
            
            if(scrollToBottom) box.scrollTop = box.scrollHeight;
        } catch(e) {}
    };

    // 5. إرسال رسالة
    window.sendChatMessage = async function() {
        const input = document.getElementById('chat-input');
        if(!input) return;
        const msg = input.value.trim();
        if(!msg) return;
        
        input.value = '';
        input.disabled = true;
        
        try {
            const r = await fetch('/api/web/global_chat/send', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({message: msg})
            });
            const d = await r.json();
            if(d.error) {
                if(typeof tst === 'function') tst(d.error, 'er');
            } else {
                window.loadChatMessages(true);
            }
        } catch(e) {
            if(typeof tst === 'function') tst('فشل الاتصال', 'er');
        } finally {
            input.disabled = false;
            input.focus();
        }
    };

    // دالة لحماية الموقع من أكواد HTML في الشات
    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
});
</script>

    };

    window.executeCleanVault = async function(action, btn) {
        if(typeof tst === 'function') tst('⏳ جاري الحذف...', '');
        
        try {
            const r = await fetch('/api/web/vault/clean', {
                method: 'POST',
                headers: {...H, 'Content-Type':'application/json'},
                body: JSON.stringify({action: action})
            });
            const d = await r.json();
            
            if(d.error) {
                if(typeof tst === 'function') tst(d.error, 'er');
            } else {
                if(typeof tst === 'function') tst('✅ تم حذف ' + d.deleted + ' عضو بنجاح', 'ok');
                if(typeof fireConfetti === 'function') fireConfetti();
                
                // تحديث الصفحة
                if(typeof window.r_vault === 'function') window.r_vault();
            }
        } catch(e) {
            if(typeof tst === 'function') tst('فشل الاتصال', 'er');
        }
    };

    // دالة جلب المصادر
    window.loadVaultSources = async function() {
        try {
            const r = await fetch('/api/web/vault/sources', {headers: H});
            const d = await r.json();
            const list = document.getElementById('vault-sources-list');
            if(!list) return;
            
            if(!d.sources || d.sources.length === 0) {

                { border: 'rgba(148,163,184,0.5)', bg: 'linear-gradient(135deg, rgba(148,163,184,0.15), rgba(0,0,0,0))', glow: '0 0 15px rgba(148,163,184,0.1)', icon: '🥈', color: '#94a3b8' }, // فضي
                { border: 'rgba(180,83,9,0.5)', bg: 'linear-gradient(135deg, rgba(180,83,9,0.15), rgba(0,0,0,0))', glow: '0 0 15px rgba(180,83,9,0.1)', icon: '🥉', color: '#b45309' }, // برونزي

                { border: 'rgba(59,130,246,0.3)', bg: 'linear-gradient(135deg, rgba(59,130,246,0.1), rgba(0,0,0,0))', glow: 'none', icon: '🔷', color: '#3b82f6' } // أزرق

            list.innerHTML = d.sources.map((s, i) => {

                        <div style="font-size:28px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">${style.icon}</div>
                        <div>
                            <div style="font-size:11px; color:var(--mt); font-weight:700; margin-bottom:2px;">مصدر السحب</div>

                <!-- كارت المستوى -->
                <div class="cd" style="background:linear-gradient(135deg, rgba(245,158,11,0.1), rgba(0,0,0,0)); border-color:rgba(245,158,11,0.3); display:flex; flex-direction:column; justify-content:center; align-items:center">

                </div>
